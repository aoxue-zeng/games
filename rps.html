<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜拳对决 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  .rps-stage { background:var(--mc-panel-dark);border:4px solid var(--mc-black);box-shadow: inset 4px 4px 0 0 #2a3f5f, inset -4px -4px 0 0 #000, 8px 8px 0 0 rgba(0,0,0,0.4);padding:24px;max-width:460px;margin:18px auto;text-align:center }
  .arena { display:flex; justify-content:space-around; align-items:center; margin:16px 0; }
  .hand { font-size:70px; line-height:1; filter:drop-shadow(3px 3px 0 #000); transition: transform 0.1s; }
  .hand.shaking { animation: shake 0.15s linear infinite; }
  @keyframes shake { 0%{transform:rotate(-15deg) translateY(-6px)} 50%{transform:rotate(0)} 100%{transform:rotate(15deg) translateY(-6px)} }
  .vs { font-family:'Press Start 2P',monospace; font-size:22px; color:#ffd700; text-shadow:2px 2px 0 #000; }
  .choices { display:flex; gap:14px; justify-content:center; margin:14px 0; }
  .choice { font-size:46px; background:var(--mc-night); border:3px solid #000; box-shadow: inset 3px 3px 0 0 #2a3f5f, inset -3px -3px 0 0 #000; width:90px; height:90px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition: all 0.1s; }
  .choice:hover { transform:translate(-2px,-2px); border-color:#ffd700; }
  .choice:active { transform:translate(1px,1px); }
  .bet-row { display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 }
  .bet-in{font-family:'Press Start 2P',monospace;font-size:14px;width:70px;text-align:center;background:#0d1b2a;color:#ffd700;border:2px solid var(--mc-gold);padding:6px }
  .streak { font-family:'Press Start 2P',monospace;font-size:11px;color:#ff5722;text-shadow:1px 1px 0 #000;margin-top:8px }
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="dice.html">骰子</a>
    <a href="slots.html">老虎机</a>
    <a href="rps.html">猜拳</a>
    <a href="wheel.html">转盘</a>
    <a href="horserace.html">赛马</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:34px;">✊ 猜拳对决</h1>
  <p class="subtitle">石头剪刀布！押金币赢电脑，连胜翻倍奖励</p>
  <div class="hud" style="margin-top:18px;">
    <div class="hud-item"><span class="label">金币</span><span id="coins">1000</span></div>
    <div class="hud-item"><span class="label">胜-负-平</span><span id="record">0-0-0</span></div>
    <div class="hud-item"><span class="label">连胜</span><span id="streak">0</span></div>
    <div class="hud-item"><span class="label">最高金币</span><span id="best">1000</span></div>
  </div>
  <div class="rps-stage">
    <div class="arena">
      <div><div class="hand" id="ph">✊</div><div style="font-family:'Press Start 2P',monospace;font-size:10px;color:#4dd0e1;margin-top:6px">你</div></div>
      <div class="vs">VS</div>
      <div><div class="hand" id="ch">✊</div><div style="font-family:'Press Start 2P',monospace;font-size:10px;color:#e53935;margin-top:6px">电脑</div></div>
    </div>
    <div class="bet-row">
      <span style="font-family:'Press Start 2P',monospace;font-size:11px;color:#4dd0e1">押注</span>
      <input type="number" class="bet-in" id="bet" value="50" min="10" step="10">
    </div>
    <div id="result" style="font-family:'Press Start 2P',monospace;font-size:13px;color:#ffd700;text-shadow:1px 1px 0 #000;min-height:18px">选一个出手！</div>
    <div class="choices">
      <div class="choice" data-c="0">✊</div>
      <div class="choice" data-c="1">✋</div>
      <div class="choice" data-c="2">✌️</div>
    </div>
    <div class="streak" id="streakInfo"></div>
  </div>
  <div style="margin-top:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn gold" id="resetBtn">🔄 重置金币</button>
    <a href="index.html" class="mc-btn">← 返回大厅</a>
  </div>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var HANDS=['✊','✋','✌️']; var NAMES=['石头','剪刀','布'].reverse(); // 0石头1剪刀2布顺序调整
  // 0=石头 1=剪刀 2=布；胜：0>1,1>2,2>0
  var state={coins:1000,best:1000,w:0,l:0,d:0,streak:0,maxStreak:0,playing:false};
  var ph=document.getElementById('ph'),ch=document.getElementById('ch');
  function load(){try{var s=JSON.parse(localStorage.getItem('rps_state'));if(s){state.coins=s.coins;state.best=s.best;state.w=s.w;state.l=s.l;state.d=s.d;state.streak=s.streak;state.maxStreak=s.maxStreak;}}catch(e){}}
  function save(){localStorage.setItem('rps_state',JSON.stringify(state));}
  function updateHud(){
    document.getElementById('coins').textContent=state.coins;
    document.getElementById('record').textContent=state.w+'-'+state.l+'-'+state.d;
    document.getElementById('streak').textContent=state.streak;
    document.getElementById('best').textContent=state.best;
    var si=document.getElementById('streakInfo');
    si.textContent = state.streak>=2?('🔥 '+state.streak+'连胜！下次赢x'+(1+state.streak*0.5).toFixed(1)):'';
  }
  function judge(p,c){
    if(p===c)return 0;
    if((p===0&&c===1)||(p===1&&c===2)||(p===2&&c===0))return 1;
    return -1;
  }
  function play(p){
    if(state.playing)return;
    var bet=parseInt(document.getElementById('bet').value,10)||0;
    if(bet<10){toast('最少押10');return;}
    if(bet>state.coins){toast('金币不够！');return;}
    AOXSound.ensure();state.playing=true;state.coins-=bet;updateHud();
    ph.textContent=HANDS[0];ch.textContent=HANDS[0];
    ph.classList.add('shaking');ch.classList.add('shaking');
    document.getElementById('result').textContent='猜拳...';
    var t=0;var iv=setInterval(function(){t++;ph.textContent=HANDS[t%3];ch.textContent=HANDS[(t+1)%3];SFX.move();if(t>=10){clearInterval(iv);finish(p,bet);}},100);
  }
  function finish(p,bet){
    ph.classList.remove('shaking');ch.classList.remove('shaking');
    // 电脑略带倾向：连胜多时更难赢
    var c;
    var r=Math.random();
    if(state.streak>=3 && r<0.4){ // 电脑识破：选克制p的
      c=(p+2)%3; // 克制p
    } else { c=Math.floor(Math.random()*3); }
    ph.textContent=HANDS[p];ch.textContent=HANDS[c];
    var j=judge(p,c);
    if(j===0){
      state.d++;state.streak=0;document.getElementById('result').textContent='🤝 平局！退回押注';state.coins+=bet;SFX.back();
    } else if(j===1){
      state.w++;state.streak++;
      var mult=1+Math.min(state.streak,5)*0.5; // 连击翻倍（最高x3.5）
      var gain=Math.round(bet*mult);
      state.coins+=gain;
      document.getElementById('result').innerHTML='🎉 赢！+'+gain+(state.streak>=2?' <span style="color:#ff5722">x'+mult.toFixed(1)+'</span>':'');
      SFX.win();
    } else {
      state.l++;state.streak=0;document.getElementById('result').textContent='💔 输了 -'+bet;SFX.lose();
    }
    if(state.streak>state.maxStreak)state.maxStreak=state.streak;
    if(state.coins>state.best)state.best=state.coins;
    state.playing=false;
    updateHud();save();
    if(state.coins<=0)toast('破产了！点重置');
  }
  document.querySelectorAll('.choice').forEach(function(el){el.addEventListener('click',function(){play(parseInt(el.dataset.c,10));});});
  document.getElementById('resetBtn').addEventListener('click',function(){state.coins=1000;state.w=0;state.l=0;state.d=0;state.streak=0;updateHud();save();SFX.click();toast('重置 1000 金币');});
  load();updateHud();
})();
</script>
</body>
</html>
