<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记忆节奏 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  .sim-stage{background:var(--mc-panel-dark);border:4px solid var(--mc-black);box-shadow:inset 4px 4px 0 0 #2a3f5f,inset -4px -4px 0 0 #000,8px 8px 0 0 rgba(0,0,0,0.4);padding:24px;max-width:480px;margin:16px auto;}
  .sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:380px;margin:0 auto;aspect-ratio:1;}
  .sim-pad{border:5px solid #000;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:50px;opacity:0.6;transition:opacity 0.1s,transform 0.1s;user-select:none;}
  .sim-pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 30px currentColor;}
  .sim-pad.p1{background:#e53935;color:#e53935;}
  .sim-pad.p2{background:#43a047;color:#43a047;}
  .sim-pad.p3{background:#fdd835;color:#fdd835;}
  .sim-pad.p4{background:#1976d2;color:#1976d2;}
  .sim-pad:hover{opacity:0.85;}
  .sim-status{text-align:center;font-family:'Press Start 2P',monospace;font-size:14px;color:#ffd700;text-shadow:2px 2px 0 #000;margin-bottom:16px;min-height:20px;}
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html">首页</a><a href="simonsays.html">记忆节奏</a><a href="whackmole.html">打地鼠</a><a href="balanceball.html">平衡球</a><a href="say.html">记忆大师</a><a href="flip.html">记忆配对</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:32px;">🎵 记忆节奏</h1>
  <p class="subtitle">看灯亮顺序，复现出来！每关+1，6色进阶，越打越长</p>
  <div class="hud" style="margin-top:14px;">
    <div class="hud-item"><span class="label">关卡</span><span id="level">0</span></div>
    <div class="hud-item"><span class="label">最高</span><span id="best">0</span></div>
    <div class="hud-item"><span class="label">状态</span><span id="phase">待开始</span></div>
  </div>
  <div class="sim-stage">
    <div class="sim-status" id="status">点开始按钮！</div>
    <div class="sim-grid">
      <div class="sim-pad p1" data-i="0">🔴</div>
      <div class="sim-pad p2" data-i="1">🟢</div>
      <div class="sim-pad p3" data-i="2">🟡</div>
      <div class="sim-pad p4" data-i="3">🔵</div>
    </div>
  </div>
  <div style="margin-top:12px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
    <button class="mc-btn green" id="startBtn">▶ 开始</button>
    <a href="index.html" class="mc-btn">← 返回</a>
  </div>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script><script src="mobile.js"></script><script src="shared.js"></script>
<script>
(function(){
  var seq=[],user=[],level=0,running=false,playing=false,accept=false;
  var best=parseInt(localStorage.getItem('sim_best')||'0',10);
  document.getElementById('best').textContent=best;
  var pads=document.querySelectorAll('.sim-pad');
  var statusEl=document.getElementById('status'),phaseEl=document.getElementById('phase');
  function setStatus(t,p){statusEl.textContent=t;phaseEl.textContent=p;}
  function light(i,dur){
    return new Promise(function(res){
      pads[i].classList.add('lit');
      SFX.click();
      setTimeout(function(){pads[i].classList.remove('lit');setTimeout(res,dur||180);},dur||400);
    });
  }
  async function playSeq(){
    playing=true;accept=false;setStatus('注意看…','播放中');
    await new Promise(function(r){setTimeout(r,600);});
    for(var i=0;i<seq.length;i++){
      await light(seq[i],Math.max(250,500-level*15));
    }
    playing=false;accept=true;user=[];setStatus('该你了！按出顺序','你的回合');
  }
  function next(){
    level++;seq.push(Math.floor(Math.random()*4));
    document.getElementById('level').textContent=level;
    playSeq();
  }
  function start(){
    AOXSound.ensure();
    seq=[];user=[];level=0;running=true;
    document.getElementById('level').textContent=0;
    SFX.select();next();
  }
  function fail(){
    running=false;accept=false;SFX.lose();
    if(level-1>best){best=level-1;localStorage.setItem('sim_best',best);document.getElementById('best').textContent=best;toast('🏆 新纪录 '+best+' 关！');}
    else toast('💀 失败！过了 '+(level-1)+' 关');
    setStatus('失败！点开始重玩','结束');
  }
  pads.forEach(function(p){
    function tap(){ if(!accept)return; var i=parseInt(p.dataset.i); p.classList.add('lit'); SFX.coin(); setTimeout(function(){p.classList.remove('lit');},200);
      user.push(i);
      if(user[user.length-1]!==seq[user.length-1]){fail();return;}
      if(user.length===seq.length){ accept=false; setStatus('正确！下一关…','过渡'); SFX.win(); setTimeout(next,700); }
    }
    p.addEventListener('click',tap);
    p.addEventListener('touchstart',function(e){e.preventDefault();tap();},{passive:false});
  });
  document.getElementById('startBtn').addEventListener('click',start);
})();
</script>
</body>
</html>
