<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇·进化版 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  #gc{background:#0d1b0d;display:block;width:min(440px,100%);height:auto;border:3px solid #000;border-radius:8px;image-rendering:pixelated;touch-action:none;}
  .fx{display:inline-block;padding:2px 8px;border:2px solid #000;border-radius:5px;font-size:14px;margin:2px;background:#333;color:#fff;}
  .fx.on{background:#4caf50;}
  .fx.ghost.on{background:#9c27b0;}.fx.slow.on{background:#4dd0e1;}.fx.x2.on{background:#ffd700;color:#000;}.fx.dash.on{background:#e53935;}
  .dpad{display:none;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin-top:10px;}
  .dpad button{height:52px;font-size:22px;background:#2b3a55;color:#fff;border:3px solid #4a6080;border-radius:8px;}
  @media (hover:none) and (pointer:coarse){.dpad{display:grid;}}
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar"><a href="index.html" class="logo">⛏ AoXuan.World</a><nav><a href="index.html">首页</a><a href="snake.html">原版贪吃蛇</a><a href="snake-neon.html">霓虹贪吃蛇</a></nav></div>
<div class="container center">
  <h1 class="title-3d" style="font-size:30px;">🐍 贪吃蛇 · 进化版</h1>
  <p class="subtitle">5种神奇食物 + 冲刺技能 + 关卡障碍 + 连击系统</p>
  <div class="hud" style="margin-top:12px;flex-wrap:wrap;">
    <div class="hud-item"><span class="label">分数</span><span id="score">0</span></div>
    <div class="hud-item"><span class="label">等级</span><span id="level">1</span></div>
    <div class="hud-item"><span class="label">连击</span><span id="combo">x1</span></div>
    <div class="hud-item"><span class="label">最佳</span><span id="best">0</span></div>
  </div>
  <div style="margin:6px 0;">
    <span class="fx ghost" id="fxGhost">👻穿身</span>
    <span class="fx x2" id="fxX2">⭐双倍</span>
    <span class="fx dash" id="fxDash">💨冲刺(空格)</span>
    <span class="fx" id="fxCd"></span>
  </div>
  <div class="game-stage" style="margin-top:6px;"><canvas id="gc" width="440" height="480"></canvas></div>
  <div class="dpad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div>
  <div style="margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <button class="mc-btn green" id="startBtn">▶ 开始</button>
    <a href="index.html" class="mc-btn">← 返回</a>
  </div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:14px;margin-top:8px;">
    🍎+10 · 🍇+30连击 · 🌶️穿身10s · ⭐双倍15s · ❄️减速自控 · 空格冲刺(3s速度x2得分x2) · 每100分升级加障碍
  </p>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script><script src="mobile.js"></script><script src="shared.js"></script>
<script>
(function(){
var c=document.getElementById('gc'),x=c.getContext('2d'),W=440,H=480,CS=20,GW=W/CS,GH=H/CS;
var best=parseInt(localStorage.getItem('snakeEvoBest')||'0',10);
document.getElementById('best').textContent=best;
var snake=[],dir={x:1,y:0},nextDir={x:1,y:0},foods=[],walls=[],score=0,level=1,combo=1,comboT=0,dead=false,acc=0,last=0,effects={ghost:0,x2:0,slow:0,dash:0},dashCd=0,started=false;
var FOODS=[
 {i:'🍎',c:'#e53935',pts:10,grow:1,w:.5},
 {i:'🍇',c:'#8bc34a',pts:30,grow:2,w:.16},
 {i:'🌶️',c:'#ff7043',pts:15,grow:1,w:.12,fx:'ghost'},
 {i:'⭐',c:'#ffd700',pts:20,grow:1,w:.12,fx:'x2'},
 {i:'❄️',c:'#4dd0e1',pts:15,grow:1,w:.1,fx:'slow'}
];
function init(){
 snake=[{x:Math.floor(GW/2),y:Math.floor(GH/2)},{x:Math.floor(GW/2)-1,y:Math.floor(GH/2)},{x:Math.floor(GW/2)-2,y:Math.floor(GH/2)}];
 dir={x:1,y:0};nextDir=dir;foods=[];walls=[];score=0;level=1;combo=1;comboT=0;dead=false;acc=0;last=0;started=true;
 effects={ghost:0,x2:0,slow:0,dash:0};dashCd=0;
 spawnFood();spawnFood();updHud();
}
function cellFree(gx,gy){
 if(walls.some(function(w){return w.x===gx&&w.y===gy;}))return false;
 if(snake.some(function(s){return s.x===gx&&s.y===gy;}))return false;
 if(foods.some(function(f){return f.x===gx&&f.y===gy;}))return false;
 return true;
}
function spawnFood(){
 for(var t=0;t<80;t++){
  var gx=Math.floor(Math.random()*GW),gy=Math.floor(Math.random()*GH);
  if(!cellFree(gx,gy))continue;
  var r=Math.random(),acc2=0,def=FOODS[0];
  for(var i=0;i<FOODS.length;i++){acc2+=FOODS[i].w;if(r<acc2){def=FOODS[i];break;}}
  foods.push({x:gx,y:gy,def:def,t:Math.random()*6});
  return;
 }
}
function addWalls(n){
 for(var k=0;k<n;k++){
  for(var t=0;t<40;t++){
   var gx=2+Math.floor(Math.random()*(GW-4)),gy=2+Math.floor(Math.random()*(GH-4));
   if(Math.abs(gy-snake[0].y)<3&&Math.abs(gx-snake[0].x)<5)continue;
   if(cellFree(gx,gy)){walls.push({x:gx,y:gy});break;}
  }
 }
}
function updHud(){
 document.getElementById('score').textContent=score;
 document.getElementById('level').textContent=level;
 document.getElementById('combo').textContent='x'+combo;
 var f=function(id,on,txt){var e=document.getElementById(id);e.classList.toggle('on',on);};
 f('fxGhost',effects.ghost>0);f('fxX2',effects.x2>0);f('fxDash',effects.dash>0);
 document.getElementById('fxCd').textContent=dashCd>0?'冲刺'+Math.ceil(dashCd/10)+'s':'冲刺就绪';
 document.getElementById('fxCd').classList.toggle('on',dashCd<=0);
}
function step(){
 var nx=snake[0].x+dir.x,ny=snake[0].y+dir.y;
 if(nx<0||ny<0||nx>=GW||ny>=GH){die();return;}
 var hitWall=walls.some(function(w){return w.x===nx&&w.y===ny;});
 if(hitWall){die();return;}
 var selfHit=snake.some(function(s,i){return i<snake.length-1&&s.x===nx&&s.y===ny;});
 if(selfHit&&effects.ghost<=0){die();return;}
 snake.unshift({x:nx,y:ny});
 var ate=-1;
 for(var i=0;i<foods.length;i++){if(foods[i].x===nx&&foods[i].y===ny){ate=i;break;}}
 if(ate>=0){
  var fd=foods[ate].def;
  comboT=50;combo=Math.min(9,combo+ (fd.i==='🍇'?2:1));
  var pts=fd.pts*combo*(effects.x2>0?2:1)*(effects.dash>0?2:1);
  score+=pts;SFX.coin();
  for(var g=0;g<fd.grow-1;g++)snake.push({x:snake[snake.length-1].x,y:snake[snake.length-1].y});
  if(fd.fx==='ghost'){effects.ghost=100;SFX.unlock();}
  if(fd.fx==='x2'){effects.x2=150;SFX.gem();}
  if(fd.fx==='slow'){effects.slow=180;SFX.bubble();}
  foods.splice(ate,1);spawnFood();
  var nl=Math.floor(score/100)+1;
  if(nl>level){level=nl;addWalls(3);SFX.levelUp();toast('⬆ Lv.'+level+'！新障碍出现！');}
  if(foods.length<2&&Math.random()<.5)spawnFood();
 } else snake.pop();
 updHud();
}
function die(){
 dead=true;started=false;SFX.lose();
 if(score>best){best=score;localStorage.setItem('snakeEvoBest',best);document.getElementById('best').textContent=best;}
 toast('💀 游戏结束！得分 '+score+' · Lv.'+level);
}
function update(dt){
 if(!started||dead)return;
 acc+=dt;
 var speed=130-level*8;
 if(effects.dash>0)speed*=.5;
 if(effects.slow>0)speed*=1.6;
 while(acc>speed){acc-=speed;step();if(dead)break;}
 if(comboT>0){comboT--;if(comboT===0){combo=1;updHud();}}
 ['ghost','x2','slow','dash'].forEach(function(k){if(effects[k]>0){effects[k]--;if(effects[k]===0)updHud();}});
 if(dashCd>0){dashCd--;if(dashCd===0)updHud();}
}
function draw(){
 x.fillStyle='#0d1b0d';x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(255,255,255,.04)';
 for(var i=0;i<=GW;i++){x.beginPath();x.moveTo(i*CS,0);x.lineTo(i*CS,H);x.stroke();}
 for(var j=0;j<=GH;j++){x.beginPath();x.moveTo(0,j*CS);x.lineTo(W,j*CS);x.stroke();}
 walls.forEach(function(w){x.fillStyle='#5d4037';x.fillRect(w.x*CS+1,w.y*CS+1,CS-2,CS-2);x.fillStyle='#3e2723';x.fillRect(w.x*CS+1,w.y*CS+1,CS-2,4);});
 foods.forEach(function(f){f.t+=.1;var bob=Math.sin(f.t)*2;x.font='16px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(f.def.i,f.x*CS+CS/2,f.y*CS+CS/2+bob);});
 var hue=(level*40)%360;
 snake.forEach(function(s,i){
  var t=i/snake.length;
  x.fillStyle=effects.ghost>0?'hsla('+hue+',70%,60%,.45)':'hsl('+hue+','+(70-t*30)+'%,'+(55-t*20)+'%)';
  x.fillRect(s.x*CS+1,s.y*CS+1,CS-2,CS-2);
  if(i===0){x.fillStyle='#fff';var ex=s.x*CS+CS/2+dir.x*4,ey=s.y*CS+CS/2+dir.y*4;x.fillRect(ex-4+dir.y*3,ey-3,3,3);x.fillRect(ex+1-dir.y*3,ey-3,3,3);}
 });
 if(effects.dash>0){var h0=snake[0];x.strokeStyle='#e53935';x.lineWidth=2;x.strokeRect(h0.x*CS-2,h0.y*CS-2,CS+4,CS+4);}
 if(dead){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,H/2-40,W,80);x.fillStyle='#e53935';x.font='24px "Press Start 2P",monospace';x.textAlign='center';x.fillText('GAME OVER',W/2,H/2-8);x.fillStyle='#fff';x.font='14px monospace';x.fillText('得分 '+score+' · 点开始再来',W/2,H/2+20);}
 if(!started&&!dead){x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,H/2-50,W,100);x.fillStyle='#ffd700';x.font='20px "Press Start 2P",monospace';x.textAlign='center';x.fillText('🐍 进化版',W/2,H/2-14);x.fillStyle='#fff';x.font='14px monospace';x.fillText('方向键移动 · 空格冲刺 · 点▶开始',W/2,H/2+16);}
}
function loop(ts){
 var dt=ts-(last||ts);last=ts;update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function setDir(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;nextDir={x:dx,y:dy};}
document.addEventListener('keydown',function(e){
 var k=e.key;
 if(k==='ArrowUp'||k==='w'||k==='W')setDir(0,-1);
 else if(k==='ArrowDown'||k==='s'||k==='S')setDir(0,1);
 else if(k==='ArrowLeft'||k==='a'||k==='A')setDir(-1,0);
 else if(k==='ArrowRight'||k==='d'||k==='D')setDir(1,0);
 else if(k===' '){e.preventDefault();dash();}
});
var tsx=0,tsy=0;
c.addEventListener('touchstart',function(e){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
c.addEventListener('touchend',function(e){
 var dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
 if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
},{passive:true});
document.querySelectorAll('.dpad button').forEach(function(b){
 b.addEventListener('pointerdown',function(e){e.preventDefault();var d=b.dataset.d.split(',');setDir(+d[0],+d[1]);});
});
function dash(){
 if(dashCd>0||!started||dead){if(dashCd>0)SFX.error();return;}
 effects.dash=30;dashCd=80;SFX.jump();updHud();
}
document.getElementById('startBtn').addEventListener('click',function(){init();SFX.click();});
})();
</script>
</body>
</html>
