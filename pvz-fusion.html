  function todaySeed(){ var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
  function getDailyPlant(){
    var seed=todaySeed();
    var idx=seed % DAILY.length;
    var p=DAILY[idx];
    p._day=seed;
    return p;
  }
  // 最近7天的每日植物（今天+昨天+前天，便于用户回看）
  function getRecentDaily(){
    var list=[]; var base=todaySeed();
    // 解码日期
    function dec(s){ var y=Math.floor(s/10000); var m=Math.floor(s/100)%100; var d=s%100; return new Date(y,m-1,d); }
    for(var i=0;i<3;i++){
      var dt=dec(base); dt.setDate(dt.getDate()-i);
      var s=dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate();
      var p=DAILY[s % DAILY.length]; p._day=s;
      list.push(p);
    }
    return list;

  function findDef(id){

  function autoFuse(ids){

    var id='auto_'+ids.sort().join('_');
    return { id:id, name:defs.map(function(d){return d.name[0];}).join('')+'合体', icon:icon, cost:100, hp:Math.round(hp), recharge:5,

  function update(){
    if(!state.running||state.over) return;
    Object.keys(BASE).forEach(function(k){ var p=BASE[k]; if(p._cd&&p._cd>0){p._cd-=1/60;if(p._cd<0)p._cd=0;} });

      if(d.squash){ if(!pl.squashTarget||pl.squashTarget.hp<=0){ var near=null,nd=999; for(var zs=0;zs<zombies.length;zs++){ var zss=zombies[zs]; if(zss.r===pl.r&&!zss.flying&&zss.x>pl.x-30&&zss.x<pl.x+200){ var dd=Math.abs(zss.x-pl.x); if(dd<nd){nd=dd;near=zss;} } } pl.squashTarget=near; } if(pl.squashTarget){ for(var zsq=zombies.length-1;zsq>=0;zsq--){ var zsqq=zombies[zsq]; if(zsqq.r===pl.r&&!zsqq.flying&&Math.abs(zsqq.x-pl.squashTarget.x)<40){ dmgZ(zsqq,500); spawnParticles(zsqq.x,zsqq.y,'#8bc34a',10);} } SFX.hit(); grid[pl.r][pl.c]=null; plants.splice(i,1); continue; } }

    ctx.fillStyle='#fff'; ctx.fillRect(-4,-13,3,3); ctx.fillRect(2,-13,3,3); ctx.fillStyle='#000'; ctx.fillRect(-3,-12,1,1); ctx.fillRect(3,-12,1,1); ctx.fillStyle='#000'; ctx.fillRect(-3,-8,6,1);
    if(zm.armorType==='bucket'&&zm.armorHp>0){ ctx.fillStyle='#9e9e9e'; ctx.fillRect(-8,-22,16,6); }
    else if(zm.armorType==='cone'&&zm.armorHp>0){ ctx.fillStyle='#ff9800'; ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-7,-18); ctx.lineTo(7,-18); ctx.fill(); }
    if(zm.flying){ ctx.strokeStyle='#888'; ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(0,-40); ctx.stroke(); ctx.fillStyle='#e53935'; ctx.beginPath(); ctx.ellipse(0,-46,10,12,0,0,7); ctx.fill(); }
    if(zm.slow>0){ ctx.fillStyle='rgba(77,208,225,0.3)'; ctx.fillRect(-10,-22,20,32); }
    if(zm.burn>0){ ctx.fillStyle='rgba(255,87,34,0.4)'; ctx.fillRect(-10,-22,20,32); ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('🔥',0,-26); }
    if(zm.hypno){ ctx.fillStyle='rgba(156,39,176,0.4)'; ctx.fillRect(-10,-22,20,32); ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.fillText('💕',0,-26); }
    ctx.restore();
    if(zm.hp<zm.maxhp||(zm.armorMax&&zm.armorHp<zm.armorMax)){ var by=y-30; ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x-12,by,24,3); ctx.fillStyle='#e53935'; ctx.fillRect(x-12,by,24*(zm.hp/zm.maxhp),3); }
  }
  function drawSun(su){ if(su.collected)return; var bob=Math.sin(su.bob)*2; var x=su.x,y=su.y+bob;
    if(su.cartDrop){ ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.fillText('🛒',x,y); ctx.fillStyle='rgba(158,158,158,0.4)'; ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.fill(); return; }
    var g=ctx.createRadialGradient(x,y,4,x,y,22); g.addColorStop(0,'rgba(255,235,59,0.9)'); g.addColorStop(0.5,'rgba(255,215,0,0.4)'); g.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,22,0,7); ctx.fill(); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.fill(); ctx.fillStyle='#ffeb3b'; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.fill();
  }
  function drawBullet(bu){ ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(bu.x-8,bu.y-1,6,2);
    if(bu.type==='pea'){ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(bu.x,bu.y,6,0,7);ctx.fill();}
    else if(bu.type==='fire'){ctx.fillStyle='rgba(255,87,34,0.5)';ctx.beginPath();ctx.arc(bu.x,bu.y,9,0,7);ctx.fill();ctx.fillStyle='#ff5722';ctx.beginPath();ctx.arc(bu.x,bu.y,6,0,7);ctx.fill();}
    else if(bu.type==='spike'){ctx.fillStyle='#fff';ctx.fillRect(bu.x-1,bu.y-5,3,10);}
    else {ctx.fillStyle='#4dd0e1';ctx.beginPath();ctx.arc(bu.x,bu.y,6,0,7);ctx.fill();}
  }

  function draw(){
    drawLawn();
    // 按y排序
    var ents=[]; plants.forEach(function(pl){ if(pl.def.mower) pl.drawX=pl.x+pl.moverX; else pl.drawX=pl.x; ents.push({y:pl.y,fn:function(){ var sx=pl.x; pl.x=pl.drawX; drawPlant(pl); pl.x=sx; }}); });
    zombies.forEach(function(zm){ ents.push({y:zm.y+(zm.flying?-40:0),fn:function(){ drawZombie(zm); }}); });
    ents.sort(function(a,b){return a.y-b.y;}); ents.forEach(function(e){e.fn();});
    bullets.forEach(drawBullet); suns.forEach(drawSun);
    particles.forEach(function(pt){ if(pt.type==='text'){ctx.globalAlpha=Math.min(1,pt.life/20);ctx.fillStyle=pt.color;ctx.font='bold 14px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillText(pt.text,pt.x,pt.y);} else {ctx.globalAlpha=pt.life/30;ctx.fillStyle=pt.color;ctx.fillRect(pt.x,pt.y,pt.size,pt.size);} ctx.globalAlpha=1; });
    // 种植预览
    if(selectedCard&&mouse.x>0&&!drag){ var cell=cellAt(mouse.x,mouse.y); if(cell&&!grid[cell.r][cell.c]){ var d=findDef(selectedCard); ctx.globalAlpha=0.5; ctx.font='34px sans-serif'; ctx.textAlign='center'; ctx.fillText(d.icon,LAWN_X+cell.c*CELL_W+CELL_W/2,LAWN_Y+cell.r*CELL_H+CELL_H/2+6); ctx.globalAlpha=1; ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.strokeRect(LAWN_X+cell.c*CELL_W,LAWN_Y+cell.r*CELL_H,CELL_W,CELL_H); } }
    // 拖拽幽灵
    if(drag){ ctx.globalAlpha=0.6; ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.fillText(drag.def.icon,mouse.x,mouse.y+6); ctx.globalAlpha=1; }
    // 结算
    if(!state.running){ ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
      if(state.won){ ctx.fillStyle='#4caf50'; ctx.font='28px "Press Start 2P",monospace'; ctx.fillText('🎉 守卫成功！',W/2,H/2-10); }
      else if(state.over){ ctx.fillStyle='#e53935'; ctx.font='26px "Press Start 2P",monospace'; ctx.fillText('游戏结束',W/2,H/2-10); }
      else { ctx.fillStyle='#ffd700'; ctx.font='22px "Press Start 2P",monospace'; ctx.fillText('植物融合版',W/2,H/2-10); ctx.fillStyle='#fff'; ctx.font='11px "Press Start 2P",monospace'; ctx.fillText('点开始 · 融合你的植物',W/2,H/2+22); }
    }
  }

  // ===== 输入 =====
  function getPos(e){ var rect=canvas.getBoundingClientRect(); var cx=e.clientX!==undefined?e.clientX:(e.touches&&e.touches[0].clientX); var cy=e.clientY!==undefined?e.clientY:(e.touches&&e.touches[0].clientY); return {x:(cx-rect.left)*(W/rect.width),y:(cy-rect.top)*(H/rect.height)}; }
  function handleDown(px,py){
    if(!state.running||state.over)return;
    // 玉米加农炮：点击发射，目标为点击位置所在行的最远僵尸
    for(var ci=plants.length-1;ci>=0;ci--){ var cp=plants[ci]; if(cp.def.skill==='cobcannon'&&cp.cannonReady<=0&&Math.hypot(cp.x-px,cp.y-py)<30){ cp.cannonReady=300; SFX.boom();
      // 找点击行最远僵尸
      var targetR=cp.r; var target=null; var maxD=-1;
      for(var cz=0;cz<zombies.length;cz++){ var czz=zombies[cz]; if(czz.r===targetR&&!czz.flying&&czz.x>cp.x&&czz.x>maxD){ maxD=czz.x; target=czz; } }
      // 范围核爆
      var tx=target?target.x:Math.min(W-50,px); var ty=target?target.y:cp.y;
      for(var czb=zombies.length-1;czb>=0;czb--){ var czb2=zombies[czb]; if(!czb2.flying&&Math.abs(czb2.x-tx)<CELL_W*2&&Math.abs(czb2.y-ty)<CELL_H*2){ dmgZ(czb2,800); } }
      spawnParticles(tx,ty,'#fdd835',40); SFX.hit();
      return;
    } }
    // 收阳光/推车
    for(var i=suns.length-1;i>=0;i--){ var s=suns[i]; if(!s.collected&&Math.hypot(s.x-px,s.y-py)<24){ if(s.cartDrop){ unlockedFusions['cart']=Object.assign({id:'cart'},BASE.cart); buildCards(); SFX.coin(); toast('🛒 解锁推车！可融合'); suns.splice(i,1); } else collectSun(s); return; } }
    // 拖拽：点中草地植物开始拖
    var cell=cellAt(px,py);
    if(cell&&grid[cell.r][cell.c]&&!shovelMode&&!selectedCard){
      drag=grid[cell.r][cell.c]; drag._fromR=cell.r; drag._fromC=cell.c;
      return;
    }
    if(shovelMode&&cell&&grid[cell.r][cell.c]){ grid[cell.r][cell.c]=null; plants=plants.filter(function(p){return !(p.r===cell.r&&p.c===cell.c);}); SFX.dig(); shovelMode=false; document.getElementById('shovelBtn').classList.remove('active'); return; }
    if(selectedCard&&cell){ if(grid[cell.r][cell.c]){SFX.error();return;} plantAt(cell.r,cell.c,selectedCard); selectedCard=null; buildCards(); }
  }
  function handleUp(px,py){
    if(drag){ var cell=cellAt(px,py); if(cell&&grid[cell.r][cell.c]&&!(cell.r===drag._fromR&&cell.c===drag._fromC)){ // 融合
      var a=drag, b=grid[cell.r][cell.c];
      doFuse([a.def.id, b.def.id]);
      // 移除两个原植物
      grid[a._fromR][a._fromC]=null; grid[cell.r][cell.c]=null;
      plants=plants.filter(function(p){return p!==a&&p!==b;});
      SFX.place();
    } drag=null; }
  }
  canvas.addEventListener('mousedown',function(e){ var p=getPos(e); mouse.down=true; handleDown(p.x,p.y); });
  canvas.addEventListener('mouseup',function(e){ var p=getPos(e); mouse.down=false; handleUp(p.x,p.y); });
  canvas.addEventListener('mousemove',function(e){ var p=getPos(e); mouse.x=p.x; mouse.y=p.y; });
  canvas.addEventListener('touchstart',function(e){ e.preventDefault(); var p=getPos(e); mouse.x=p.x; mouse.y=p.y; handleDown(p.x,p.y); },{passive:false});
  canvas.addEventListener('touchmove',function(e){ e.preventDefault(); var p=getPos(e); mouse.x=p.x; mouse.y=p.y; },{passive:false});
  canvas.addEventListener('touchend',function(e){ e.preventDefault(); handleUp(mouse.x,mouse.y); },{passive:false});

  document.getElementById('shovelBtn').addEventListener('click',function(){ if(!state.running||state.over)return; shovelMode=!shovelMode; selectedCard=null; this.classList.toggle('active',shovelMode); buildCards(); SFX.click(); });

  function start(){ init(); state.running=true; state.betweenTimer=240; AOXSound.ensure(); AOXSound.startBGM('game'); SFX.select(); toast('🌱 点卡片选植物，点草地种植，拖植物叠到另一个上融合！'); }
  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  document.getElementById('startBtn').addEventListener('click',start);
  init(); loop();
})();
</script>
</body>
</html>
