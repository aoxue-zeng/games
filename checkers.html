<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际跳棋 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  #gameCanvas { background:#5d3a1a; touch-action:none; cursor:pointer; }
  .key { display:inline-block; background:var(--mc-panel); border:2px solid #000; box-shadow: inset -2px -2px 0 0 var(--mc-shadow), inset 2px 2px 0 0 var(--mc-highlight); padding:3px 8px; font-family:'Press Start 2P',monospace; font-size:10px; margin:0 2px; }
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="gomoku.html">五子棋</a>
    <a href="reversi.html">黑白棋</a>
    <a href="checkers.html">跳棋</a>
    <a href="pvz.html">植物僵尸</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:34px;">🔴 国际跳棋</h1>
  <p class="subtitle">跳吃对方棋子！走到底线升王，吃光对手获胜</p>
  <div class="hud" style="margin-top:18px;">
    <div class="hud-item"><span class="label">你(红)</span><span id="pc">12</span></div>
    <div class="hud-item"><span class="label">AI(蓝)</span><span id="ac">12</span></div>
    <div class="hud-item"><span class="label">回合</span><span id="turn">你的回合</span></div>
    <div class="hud-item"><span class="label">战绩</span><span id="rec">0-0</span></div>
  </div>
  <div class="game-stage" style="margin-top:14px;"><canvas id="gameCanvas" width="480" height="480"></canvas></div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:15px;margin-top:12px;">
    <span class="key">点击</span> 选子再点目标格 · 斜走一步，跳过对方棋子吃掉它
  </p>
  <div style="margin-top:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn green" id="newBtn">🔄 新对局</button>
    <a href="index.html" class="mc-btn">← 返回大厅</a>
  </div>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var SIZE=8,CELL=W/SIZE;
  // 棋子：0空 1红玩家 2蓝AI 3红王 4蓝王
  var board,turn,state,selected,mustChain,thinking,legal;
  function init(){
    board=[];
    for(var r=0;r<SIZE;r++){board.push([]);for(var c=0;c<SIZE;c++){
      var dark=(r+c)%2===1;
      if(dark&&r<3)board[r].push(2);
      else if(dark&&r>4)board[r].push(1);
      else board[r].push(0);
    }}
    turn=1;selected=null;mustChain=null;thinking=false;legal=[];
    state={over:false,pwin:parseInt(localStorage.getItem('chk_p')||'0'),awin:parseInt(localStorage.getItem('chk_a')||'0')};
    updateHud();draw();
  }
  function isKing(v){return v===3||v===4;}
  function isRed(v){return v===1||v===3;}
  function isBlue(v){return v===2||v===4;}
  function owner(v){return v===0?0:(isRed(v)?1:2);}
  function countPieces(){var p=0,a=0;for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){if(isRed(board[r][c]))p++;else if(isBlue(board[r][c]))a++;}return{p:p,a:a};}
  function updateHud(){var cnt=countPieces();document.getElementById('pc').textContent=cnt.p;document.getElementById('ac').textContent=cnt.a;document.getElementById('rec').textContent=state.pwin+'-'+state.awin;
    document.getElementById('turn').textContent=state.over?(cnt.p===0?'AI 赢':'你赢！'):(turn===1?(mustChain?'继续连跳':'你的回合'):'AI 思考中...');}
  function inB(r,c){return r>=0&&r<SIZE&&c>=0&&c<SIZE;}
  // 某棋子的合法走法（普通走）和跳吃
  function movesFor(r,c){
    var v=board[r][c];var who=owner(v);var king=isKing(v);
    var dirs;
    if(king)dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
    else if(who===1)dirs=[[-1,-1],[-1,1]]; // 红向上
    else dirs=[[1,-1],[1,1]]; // 蓝向下
    var simple=[],jumps=[];
    dirs.forEach(function(d){
      var nr=r+d[0],nc=c+d[1];
      if(inB(nr,nc)){
        if(board[nr][nc]===0)simple.push({r:nr,c:nc,jump:null});
        else if(owner(board[nr][nc])!==who){
          var jr=r+d[0]*2,jc=c+d[1]*2;
          if(inB(jr,jc)&&board[jr][jc]===0)jumps.push({r:jr,c:jc,jump:[nr,nc]});
        }
      }
    });
    return {simple:simple,jumps:jumps};
  }
  // 必须跳规则：任何能跳就必须跳
  function mustJumpList(who){
    var list=[];
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      if(owner(board[r][c])===who){var m=movesFor(r,c);if(m.jumps.length>0)list.push({r:r,c:c});}
    }
    return list;
  }
  function allMoves(who){
    var must=mustJumpList(who);
    var res=[];
    if(must.length>0){
      must.forEach(function(p){movesFor(p.r,p.c).jumps.forEach(function(j){res.push({fr:p.r,fc:p.c,tr:j.r,tc:j.c,jump:j.jump});});});
    } else {
      for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
        if(owner(board[r][c])===who){movesFor(r,c).simple.forEach(function(s){res.push({fr:r,fc:c,tr:s.r,tc:s.c,jump:null});});}
      }
    }
    return res;
  }
  function draw(){
    // 棋盘
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      ctx.fillStyle=(r+c)%2===0?'#f5e6c8':'#8b5a2b';
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    }
    // 选中高亮
    if(selected){hi(selected.r,selected.c,'#ffd700');}
    if(mustChain){hi(mustChain.r,mustChain.c,'#ff5722');}
    // 合法目标
    legal.forEach(function(m){ctx.fillStyle='rgba(76,175,80,0.4)';ctx.fillRect(m.c*CELL,m.r*CELL,CELL,CELL);ctx.strokeStyle='#4caf50';ctx.lineWidth=3;ctx.strokeRect(m.c*CELL+2,m.r*CELL+2,CELL-4,CELL-4);});
    // 棋子
    for(var r2=0;r2<SIZE;r2++)for(var c2=0;c2<SIZE;c2++){
      var v=board[r2][c2];if(!v)continue;
      var x=c2*CELL+CELL/2,y=r2*CELL+CELL/2,rad=CELL/2-5;
      ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.arc(x+2,y+3,rad,0,7);ctx.fill();
      var color=isRed(v)?'#e53935':'#1565c0';
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();
      ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=isRed(v)?'#ef5350':'#42a5f5';ctx.beginPath();ctx.arc(x,y,rad-5,0,7);ctx.stroke();
      if(isKing(v)){ctx.fillStyle='#ffd700';ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('♛',x,y+7);}
    }
  }
  function hi(r,c,col){ctx.fillStyle=col;ctx.globalAlpha=0.4;ctx.fillRect(c*CELL,r*CELL,CELL,CELL);ctx.globalAlpha=1;}
  function doMove(mv){
    var v=board[mv.fr][mv.fc];
    board[mv.fr][mv.fc]=0;
    var promoted=false;
    // 升王
    if(v===1&&mv.tr===0){v=3;promoted=true;}
    else if(v===2&&mv.tr===SIZE-1){v=4;promoted=true;}
    board[mv.tr][mv.tc]=v;
    if(mv.jump){board[mv.jump[0]][mv.jump[1]]=0;SFX.hit();SFX.clear();}
    else SFX.move();
    draw();updateHud();
    return promoted;
  }
  function checkEnd(){
    var cnt=countPieces();
    if(cnt.p===0||allMoves(1).length===0){state.over=true;state.awin++;localStorage.setItem('chk_a',state.awin);SFX.lose();toast('AI 赢了');updateHud();return true;}
    if(cnt.a===0||allMoves(2).length===0){state.over=true;state.pwin++;localStorage.setItem('chk_p',state.pwin);SFX.win();toast('🎉 你赢了！');updateHud();return true;}
    return false;
  }
  function selectPiece(r,c){
    var must=mustJumpList(turn);
    if(must.length>0 && !must.some(function(p){return p.r===r&&p.c===c;})){toast('必须用能跳吃的子！');SFX.error();return;}
    selected={r:r,c:c};
    var m=movesFor(r,c);
    legal = must.length>0 ? m.jumps.map(function(j){return {r:j.r,c:j.c,jump:j.jump};}) : m.simple.map(function(s){return {r:s.r,c:s.c,jump:null};});
    SFX.select();draw();
  }
  function tryMoveTo(r,c){
    var found=legal.find(function(m){return m.r===r&&m.c===c;});
    if(!found){selected=null;legal=[];draw();return;}
    var mv={fr:selected.r,fc:selected.c,tr:r,tc:c,jump:found.jump};
    var promoted=doMove(mv);
    selected=null;legal=[];
    // 连跳（升王不连跳）
    if(found.jump&&!promoted){
      var more=movesFor(r,c).jumps;
      if(more.length>0){mustChain={r:r,c:c};toast('连跳！');SFX.combo(3);updateHud();draw();return;}
    }
    mustChain=null;
    if(checkEnd())return;
    turn=turn===1?2:1;updateHud();
    if(turn===2){thinking=true;setTimeout(aiMove,500);}
  }
  function aiMove(){
    thinking=false;
    var moves=allMoves(2);
    if(moves.length===0){checkEnd();return;}
    // 简单AI：优先跳吃，评估走到底线+吃子价值
    function scoreMove(mv){
      var s=0;
      if(mv.jump)s+=10;
      if(board[mv.fr][mv.fc]===2&&mv.tr===SIZE-1)s+=8; // 升王
      // 中心略好
      s-=(Math.abs(mv.tr-3.5)+Math.abs(mv.tc-3.5))*0.1;
      // 避免被反吃：粗略
      s+=Math.random()*0.5;
      return s;
    }
    moves.sort(function(a,b){return scoreMove(b)-scoreMove(a);});
    var mv=moves[0];
    var promoted=doMove(mv);
    // 连跳
    if(mv.jump&&!promoted){
      var chain=true;
      function nextChain(){
        var more=movesFor(mv.tr,mv.tc).jumps;
        if(more.length>0){
          var best=more[0];
          var next={fr:mv.tr,fc:mv.tc,tr:best.r,tc:best.c,jump:best.jump};
          setTimeout(function(){promoted=doMove(next);mv={fr:next.tr,fc:next.tc,tr:next.tr,tc:next.tc}; if(!promoted)nextChain();else{if(checkEnd())return;turn=1;updateHud();}},500);
        } else {
          if(checkEnd())return;turn=1;updateHud();
        }
      }
      nextChain();return;
    }
    if(checkEnd())return;
    turn=1;updateHud();
  }
  function handleClick(e){
    if(state.over||thinking)return;
    if(turn!==1)return;
    if(mustChain){ // 强制连跳
      var r2=Math.floor((e.clientY!==undefined?0:0)); // placeholder
    }
    var rect=canvas.getBoundingClientRect();
    var x=((e.clientX!==undefined?e.clientX:e.touches[0].clientX)-rect.left)*(W/rect.width);
    var y=((e.clientY!==undefined?e.clientY:e.touches[0].clientY)-rect.top)*(H/rect.height);
    var c=Math.floor(x/CELL),r=Math.floor(y/CELL);
    if(!inB(r,c))return;
    AOXSound.ensure();
    if(mustChain){if(r===mustChain.r&&c===mustChain.c)return;selectPiece(mustChain.r,mustChain.c);tryMoveTo(r,c);return;}
    if(selected){tryMoveTo(r,c);}
    else {if(owner(board[r][c])===1)selectPiece(r,c);else SFX.error();}
  }
  canvas.addEventListener('click',handleClick);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();handleClick(e);},{passive:false});
  document.getElementById('newBtn').addEventListener('click',function(){init();SFX.click();});
  init();
})();
</script>
</body>
</html>
