<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打砖块·进化版 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  #gc{background:#0d1526;display:block;width:min(480px,100%);height:auto;border:3px solid #000;border-radius:8px;touch-action:none;}
  .pfx{display:inline-block;padding:2px 8px;border:2px solid #000;border-radius:5px;font-size:13px;margin:2px;background:#333;color:#fff;}
  .pfx.on{background:#4caf50;}
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar"><a href="index.html" class="logo">⛏ AoXuan.World</a><nav><a href="index.html">首页</a><a href="breakout.html">原版打砖块</a></nav></div>
<div class="container center">
  <h1 class="title-3d" style="font-size:30px;">🧱 打砖块 · 进化版</h1>
  <p class="subtitle">6种砖块 + 7种道具 + Boss关卡 + 激光炮台</p>
  <div class="hud" style="margin-top:12px;flex-wrap:wrap;">
    <div class="hud-item"><span class="label">分数</span><span id="score">0</span></div>
    <div class="hud-item"><span class="label">关卡</span><span id="level">1</span></div>
    <div class="hud-item"><span class="label">生命</span><span id="lives">❤❤❤</span></div>
    <div class="hud-item"><span class="label">最佳</span><span id="best">0</span></div>
  </div>
  <div style="margin:6px 0;">
    <span class="pfx" id="pfWide">📏加长</span><span class="pfx" id="pfLaser">🔫激光</span>
    <span class="pfx" id="pfSlow">🐌慢球</span><span class="pfx" id="pfPierce">🔥穿透</span>
  </div>
  <div class="game-stage" style="margin-top:6px;"><canvas id="gc" width="480" height="600"></canvas></div>
  <div style="margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <button class="mc-btn green" id="startBtn">▶ 开始</button>
    <a href="index.html" class="mc-btn">← 返回</a>
  </div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:13px;margin-top:8px;">
    鼠标/触屏/←→移动 · 普通/硬砖x2/钢砖(需穿透)/爆炸砖💥/移动砖/治疗砖❤ · 道具：多球🔢加长📏激光🔫慢球🐌穿透🔥生命❤ · 每5关Boss！
  </p>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script><script src="mobile.js"></script><script src="shared.js"></script>
<script>
(function(){
var c=document.getElementById('gc'),x=c.getContext('2d'),W=480,H=600;
var best=parseInt(localStorage.getItem('breakoutEvoBest')||'0',10);
document.getElementById('best').textContent=best;
var paddle={x:220,w:90,h:12,y:440},balls=[],bricks=[],drops=[],lasers=[],parts=[],score=0,level=1,lives=3,started=false,over=false,mx=220,fx={},eLevel=1,boss=null;
// 砖块类型: 0普通1硬2钢3爆炸4移动5治疗
var BTYPE=[
 {c:'#4caf50',hp:1,pts:10},
 {c:'#ff9800',hp:2,pts:20},
 {c:'#90a4ae',hp:99,pts:0,steel:1},
 {c:'#e53935',hp:1,pts:15,boom:1},
 {c:'#9c27b0',hp:1,pts:25,move:1},
 {c:'#4dd0e1',hp:1,pts:10,heal:1}
];
var DROPS=[
 {i:'🔢',k:'multi',n:'多球'},{i:'📏',k:'wide',n:'加长'},{i:'🔫',k:'laser',n:'激光'},
 {i:'🐌',k:'slow',n:'慢球'},{i:'🔥',k:'pierce',n:'穿透'},{i:'❤',k:'life',n:'生命'},{i:'💨',k:'fast',n:'加速球'}
];
function init(){
 paddle={x:W/2,w:90,h:12,y:H-40};balls=[];bricks=[];drops=[];lasers=[];parts=[];
 score=0;level=1;lives=3;started=true;over=false;fx={wide:0,laser:0,slow:0,pierce:0};
 buildLevel();resetBall();updHud();
}
function resetBall(){balls=[{x:W/2,y:H-80,vx:2.4*(Math.random()<.5?1:-1),vy:-3.6,r:7,stuck:false}];}
function buildLevel(){
 bricks=[];eLevel=level;
 var rows=4+Math.min(4,Math.floor(level/2)),cols=10,bw=(W-40)/cols,bh=22;
 var isBoss=level%5===0;
 for(var r=0;r<rows;r++)for(var cc=0;cc<cols;cc++){
  if(isBoss&&r===0&&cc>=2&&cc<=7){ // Boss砖块排
   bricks.push({x:20+cc*bw,y:60+r*bh,w:bw-4,h:bh-4,t:1,hp:8,maxhp:8,boss:true});continue;
  }
  var t=0,rr=Math.random();
  if(level>=2&&rr<.18)t=1;
  if(level>=3&&rr>=.18&&rr<.28)t=3;
  if(level>=4&&rr>=.28&&rr<.36)t=4;
  if(level>=5&&rr>=.36&&rr<.44)t=2;
  if(level>=2&&rr>=.44&&rr<.49)t=5;
  var def=BTYPE[t];
  bricks.push({x:20+cc*bw,y:60+r*bh,w:bw-4,h:bh-4,t:t,hp:def.hp,maxhp:def.hp,mv:def.move?{a:Math.random()*6,sp:.4+level*.05}:null,boss:false});
 }
 boss=isBoss;
}
function updHud(){
 document.getElementById('score').textContent=score;
 document.getElementById('level').textContent=level;
 document.getElementById('lives').textContent='❤'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));
 [['pfWide','wide'],['pfLaser','laser'],['pfSlow','slow'],['pfPierce','pierce']].forEach(function(p){
  document.getElementById(p[0]).classList.toggle('on',fx[p[1]]>0);
 });
}
function hitBrick(b,dmg){
 if(b.t===2&&fx.pierce<=0)return false; // 钢砖需穿透
 b.hp-=dmg;
 parts.push({x:b.x+b.w/2,y:b.y+b.h/2,life:12,col:BTYPE[b.t].c,r:5});
 if(b.hp<=0){
  var def=BTYPE[b.t];score+=def.pts+(b.boss?50:0);
  if(def.boom){ // 爆炸砖：波及邻砖
   SFX.boom();
   for(var i=0;i<12;i++)parts.push({x:b.x+b.w/2+(Math.random()-.5)*50,y:b.y+b.h/2+(Math.random()-.5)*40,life:20,col:'#ff9800',r:6});
   bricks.forEach(function(o){if(o!==b&&Math.abs(o.x-b.x)<b.w*1.6&&Math.abs(o.y-b.y)<b.h*2.4)o.hp-=2;});
  }
  if(def.heal){lives=Math.min(5,lives+1);SFX.heal();toast('❤ 治疗砖！+1生命');}
  SFX.hit();
  if(Math.random()<.22)drops.push({x:b.x+b.w/2,y:b.y,vy:2,def:DROPS[Math.floor(Math.random()*DROPS.length)]});
  bricks.splice(bricks.indexOf(b),1);
  if(b.boss)toast('💥 击破Boss砖块！');
  return true;
 }
 return false;
}
function update(){
 if(!started||over)return;
 mx=mx||W/2;
 if(keys.left)paddle.x-=7;if(keys.right)paddle.x+=7;
 paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,mx*0+paddle.x));
 paddle.w=fx.wide>0?130:90;
 // 砖块移动
 bricks.forEach(function(b){if(b.mv){b.x+=Math.sin(b.mv.a+=b.mv.sp*0.02)*1.2;if(b.x<10)b.x=10;if(b.x>W-10-b.w)b.x=W-10-b.w;}});
 // 激光
 if(fx.laser>0&&tick%14===0){lasers.push({x:paddle.x-20,y:paddle.y});lasers.push({x:paddle.x+20,y:paddle.y});}
 for(var i=lasers.length-1;i>=0;i--){
  var l=lasers[i];l.y-=8;
  if(l.y<0){lasers.splice(i,1);continue;}
  for(var j=0;j<bricks.length;j++){var b=bricks[j];
   if(l.x>b.x&&l.x<b.x+b.w&&l.y>b.y&&l.y<b.y+b.h){hitBrick(b,1);lasers.splice(i,1);break;}}
 }
 // 道具下落
 for(var d=drops.length-1;d>=0;d--){
  var dr=drops[d];dr.y+=dr.vy;
  if(dr.y>H){drops.splice(d,1);continue;}
  if(dr.y>paddle.y-10&&Math.abs(dr.x-paddle.x)<paddle.w/2+10){
   var k=dr.def.k;SFX.unlock();toast(dr.def.i+' '+dr.def.n+'！');
   if(k==='multi'){var b0=balls[0];for(var m=0;m<2;m++)balls.push({x:b0.x,y:b0.y,vx:-b0.vx*(.6+Math.random()*.5),vy:b0.vy,r:7});}
   else if(k==='wide')fx.wide=600;
   else if(k==='laser')fx.laser=500;
   else if(k==='slow')fx.slow=500;
   else if(k==='pierce')fx.pierce=400;
   else if(k==='life'){lives=Math.min(5,lives+1);}
   else if(k==='fast')balls.forEach(function(bb){bb.vx*=1.4;bb.vy*=1.4;});
   drops.splice(d,1);updHud();
  }
 }
 // 球
 for(var bi=balls.length-1;bi>=0;bi--){
  var ball=balls[bi];
  var sp=fx.slow>0?.72:1;
  ball.x+=ball.vx*sp;ball.y+=ball.vy*sp;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1;}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1;}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;}
  if(ball.y>H+20){balls.splice(bi,1);continue;}
  // 挡板
  if(ball.vy>0&&ball.y>paddle.y-ball.r&&ball.y<paddle.y+paddle.h&&Math.abs(ball.x-paddle.x)<paddle.w/2+ball.r){
   ball.vy=-Math.abs(ball.vy);
   ball.vx+=((ball.x-paddle.x)/(paddle.w/2))*2.2;
   ball.vx=Math.max(-6,Math.min(6,ball.vx));
   SFX.tick();
  }
  // 撞砖
  for(var j2=0;j2<bricks.length;j2++){
   var br=bricks[j2];
   if(ball.x>br.x-ball.r&&ball.x<br.x+br.w+ball.r&&ball.y>br.y-ball.r&&ball.y<br.y+br.h+ball.r){
    if(fx.pierce<=0||br.t!==2){
     // 反弹方向
     var ox=Math.min(Math.abs(ball.x-br.x),Math.abs(ball.x-br.x-br.w));
     var oy=Math.min(Math.abs(ball.y-br.y),Math.abs(ball.y-br.y-br.h));
     if(ox<oy)ball.vx*=-1;else ball.vy*=-1;
    }
    hitBrick(br,1);
    break;
   }
  }
 }
 if(!balls.length){ // 丢球
  lives--;SFX.hurt();updHud();
  if(lives<=0){gameOver();return;}
  resetBall();
 }
 if(!bricks.length){ // 过关
  level++;SFX.clearBig();score+=100;
  toast((level%5===1?'👑 Boss关已过！':'⬆ 第'+level+'关！')+' +100分'+(level%5===0?' · 下一关是Boss！':''));
  buildLevel();resetBall();updHud();
 }
 ['wide','laser','slow','pierce'].forEach(function(k){if(fx[k]>0){fx[k]--;if(fx[k]===0)updHud();}});
 for(var p=parts.length-1;p>=0;p--){parts[p].life--;if(parts[p].life<=0)parts.splice(p,1);}
}
function gameOver(){
 over=true;started=false;SFX.lose();
 if(score>best){best=score;localStorage.setItem('breakoutEvoBest',best);document.getElementById('best').textContent=best;}
 toast('💀 游戏结束！得分 '+score+' · 到达第 '+level+' 关');
}
var tick=0;
function draw(){
 tick++;
 x.fillStyle='#0d1526';x.fillRect(0,0,W,H);
 bricks.forEach(function(b){
  x.fillStyle=b.boss?'#7c4dff':BTYPE[b.t].c;
  x.fillRect(b.x,b.y,b.w,b.h);
  x.fillStyle='rgba(255,255,255,.25)';x.fillRect(b.x,b.y,b.w,3);
  if(b.maxhp>1&&b.hp<b.maxhp){x.fillStyle='rgba(0,0,0,.5)';x.fillRect(b.x,b.y+b.h-3,b.w,3);}
  if(b.t===3){x.fillStyle='#fff';x.font='12px serif';x.textAlign='center';x.fillText('💥',b.x+b.w/2,b.y+b.h/2+4);}
  if(b.t===5){x.fillStyle='#fff';x.font='12px serif';x.textAlign='center';x.fillText('❤',b.x+b.w/2,b.y+b.h/2+4);}
  if(b.t===2){x.fillStyle='#cfd8dc';x.fillRect(b.x+3,b.y+3,4,4);x.fillRect(b.x+b.w-7,b.y+b.h-7,4,4);}
  if(b.boss){x.fillStyle='#000';x.fillRect(b.x,b.y-6,b.w,4);x.fillStyle='#e53935';x.fillRect(b.x+1,b.y-5,(b.w-2)*(b.hp/b.maxhp),2);x.fillStyle='#fff';x.font='10px monospace';x.fillText('BOSS',b.x+b.w/2,b.y+b.h/2+3);}
 });
 drops.forEach(function(d){x.font='18px serif';x.textAlign='center';x.fillText(d.def.i,d.x,d.y);});
 lasers.forEach(function(l){x.fillStyle='#e53935';x.fillRect(l.x-2,l.y-10,4,12);});
 x.fillStyle=fx.laser>0?'#e53935':'#42a5f5';
 x.fillRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h);
 if(fx.laser>0){x.fillRect(paddle.x-paddle.w/2,paddle.y-8,8,8);x.fillRect(paddle.x+paddle.w/2-8,paddle.y-8,8,8);}
 balls.forEach(function(b){
  x.fillStyle=fx.pierce>0?'#ff7043':'#fff';
  x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();
 });
 parts.forEach(function(p){x.globalAlpha=p.life/20;x.fillStyle=p.col;x.fillRect(p.x-2,p.y-2,4,4);x.globalAlpha=1;});
 if(!started){
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,H/2-60,W,120);
  x.fillStyle='#ffd700';x.font='22px "Press Start 2P",monospace';x.textAlign='center';
  x.fillText(over?'GAME OVER':'🧱 进化版',W/2,H/2-20);
  x.fillStyle='#fff';x.font='14px monospace';
  x.fillText(over?('得分 '+score+' · 第'+level+'关'):'6种砖·7种道具·Boss关',W/2,H/2+12);
  x.fillText('点 ▶ 开始',W/2,H/2+38);
 }
}
var keys={};
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
});
document.addEventListener('keyup',function(e){
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
});
c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();var px=(e.clientX-r.left)*(W/r.width);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,px));});
c.addEventListener('touchmove',function(e){e.preventDefault();var r=c.getBoundingClientRect();var px=(e.touches[0].clientX-r.left)*(W/r.width);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,px));},{passive:false});
c.addEventListener('touchstart',function(e){e.preventDefault();var r=c.getBoundingClientRect();var px=(e.touches[0].clientX-r.left)*(W/r.width);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,px));},{passive:false});
document.getElementById('startBtn').addEventListener('click',function(){init();SFX.click();});
(function loop(){update();draw();requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
