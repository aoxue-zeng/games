<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永远差一点 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:#111; }
  .stage { background:#1c1c2e; border:3px solid #444; border-radius:10px; padding:34px 26px; max-width:560px; margin:14px auto; text-align:center; min-height:240px; position:relative; overflow:hidden; }
  .q { color:#fff; font-size:19px; margin:8px 0 18px; text-shadow:0 2px 0 #000; }
  .sub { color:#9ab; font-size:13px; }
  #trollBtn { position:absolute; padding:12px 22px; font-size:16px; font-weight:bold; background:#ffd700; border:3px solid #000; cursor:pointer; user-select:none; box-shadow:0 4px 0 #b39600; transition:top .12s,left .12s; }
  .opt { display:block; width:70%; margin:8px auto; padding:11px; font-size:15px; background:#2e3a5c; color:#fff; border:2px solid #000; cursor:pointer; }
  .opt:hover { background:#3d4f7c; }
  .bar { width:80%; height:16px; background:#000; margin:14px auto; border:2px solid #555; }
  .bar > div { height:100%; background:linear-gradient(90deg,#43a047,#ffd700); width:0%; }
  .fakeBSOD { position:fixed; inset:0; background:#0078d7; color:#fff; z-index:99; padding:60px 40px; font-size:15px; line-height:2; display:none; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav><a href="index.html">首页</a><a href="troll.html">永远差一点</a></nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:32px;">😤 永远差一点</h1>
  <p class="subtitle">一款专门气人的游戏 · 通关获得「心态大师」称号</p>
  <div class="hud" style="margin-top:14px;">
    <div class="hud-item"><span class="label">关卡</span><span id="lvl">1/5</span></div>
    <div class="hud-item"><span class="label">被整次数</span><span id="trolled">0</span></div>
    <div class="hud-item"><span class="label">称号</span><span id="title">萌新</span></div>
  </div>
  <div class="stage" id="stage">
    <div class="q" id="q"></div>
    <div id="area"></div>
  </div>
  <p class="sub" id="hint" style="color:#78909c;">提示：这游戏的开发者没有心。</p>
  <div style="margin-top:12px;display:flex;gap:10px;justify-content:center">
    <button class="mc-btn green" id="newBtn">🔄 重开</button>
    <a href="index.html" class="mc-btn">← 逃跑</a>
  </div>
</div>
<div class="fakeBSOD" id="bsod">
  <p>:(</p><p>你的电脑遇到问题，需要重新启动。</p>
<p>不过没关系，开玩笑的。0% 完成</p><p id="bsodJoke" style="color:#ffd700"></p>
</div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var lvl=1,trolled=0,escapes=0,timer=null,spinDeg=0,spinT=null;
  var TITLES=['萌新','开始怀疑','血压升高','深呼吸','心态大师'];
  var stage=document.getElementById('stage'),q=document.getElementById('q'),area=document.getElementById('area');
  function upd(){
   document.getElementById('lvl').textContent=lvl+'/5';
   document.getElementById('trolled').textContent=trolled;
   document.getElementById('title').textContent=TITLES[Math.min(4,trolled>12?4:trolled>8?3:trolled>4?2:trolled>0?1:0)];
  }
  function trollMsg(){
   trolled++;upd();SFX.error();
  }
  function toast(t){var e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e);}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2200);}
  // ===== 第1关: 会跑的开始按钮 =====
  function lv1(){
   q.textContent='第1关 · 点一下开始按钮';
   area.innerHTML='';
   var b=document.createElement('div');b.id='trollBtn';b.textContent='▶ 开始';
   b.style.left='42%';b.style.top='55%';
   stage.appendChild(b);
   escapes=0;
   b.onmouseenter=function(){run();};
   b.ontouchstart=function(ev){ev.preventDefault();run();};
   function run(){
    if(lvl!==1)return;
    escapes++;trollMsg();
    b.style.left=Math.random()*70+5+'%';
    b.style.top=Math.random()*60+15+'%';
    b.textContent=['▶ 开始','点我啊','就这?','追不上~','你真快!','>_<!'][escapes%6];
    if(escapes>=4)b.textContent='好啦好啦你赢了(点我)';
   }
   b.onclick=function(ev){
    if(lvl!==1)return;
    if(escapes<4){run();return;}
    next();
   };
  }
  // ===== 第2关: 送分题(并不) =====
  function lv2(){
   q.textContent='第2关 · 简单数学: 1+1=?';
   area.innerHTML='';
   var opts=['2','11','3'];
   opts.forEach(function(o){
    var b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=function(){trollMsg();toast('答错了!(答案明明是'+o+')');};
    area.appendChild(b);
   });
   // 正解: 点题目本身
   q.onclick=function(){trollMsg();toast('题目也能点?!');next();};
   setTimeout(function(){document.getElementById('hint').textContent='提示：选项都是错的，真理往往掌握在…题目手里。';},3000);
  }
  // ===== 第3关: 天平(什么都不做) =====
  function lv3(){
   q.textContent='第3关 · 让天平保持平衡10秒(别乱动!)';
   area.innerHTML='<div class="bar"><div id="pb"></div></div><div class="sub" id="tip3">天平很稳，千万别碰任何东西</div>';
   var t=0,timer2=setInterval(function(){
    if(lvl!==3){clearInterval(timer2);return;}
    t++;document.getElementById('pb').style.width=(t/10*100)+'%';
    if(t>=10){clearInterval(timer2);next();}
   },1000);
   // 陷阱: 任何点击都重置
   stage.onclick=function(){if(lvl===3){t=0;trollMsg();document.getElementById('tip3').textContent='说了别动! 重来!';}};
  }
  // ===== 第4关: 抽奖永远差一点 =====
  function lv4(){
   q.textContent='第4关 · 幸运大转盘! 100%有奖!';
   area.innerHTML='<div style="position:relative;width:160px;height:160px;margin:0 auto;">'+
    '<div id="wheel" style="width:150px;height:150px;border-radius:50%;background:conic-gradient(#ffd700 0 88%,#e53935 88% 100%);border:5px solid #333;transition:transform 3s cubic-bezier(.2,.8,.2,1);"></div>'+
    '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #000;"></div></div>'+
    '<button class="opt" id="spin" style="width:180px">🎰 转一盘(免费)</button>'+
    '<div class="sub" id="spinMsg">差一点点就中大奖了!</div>';
   var spins=0;
   document.getElementById('spin').onclick=function(){
    spins++;
    spinDeg+=1080+320; // 永远停在88%前的320°→大奖旁
    document.getElementById('wheel').style.transform='rotate('+spinDeg+'deg)';
    SFX.click();
    setTimeout(function(){
     if(spins<4){trollMsg();document.getElementById('spinMsg').textContent='第'+spins+'次:就差0.1°! 要不再来?';}
     else{document.getElementById('spinMsg').textContent='系统检测到您过于执着…奖励放行!';next();}
    },3100);
   };
  }
  // ===== 第5关: 胜利按钮闪电战 + 假蓝屏 =====
  function lv5(){
   q.textContent='终极关 · 点中「真·胜利」按钮';
   area.innerHTML='';
   var b=document.createElement('div');b.id='trollBtn';b.textContent='🏆 真·胜利';
   b.style.left='42%';b.style.top='55%';
   stage.appendChild(b);
   var dodges=0;
   b.onmouseenter=function(){tele();};
   b.ontouchstart=function(ev){ev.preventDefault();tele();};
   function tele(){
    if(lvl!==5)return;
    dodges++;trollMsg();
    b.style.left=Math.random()*70+5+'%';b.style.top=Math.random()*55+15+'%';
    b.textContent=['🏆 真·胜利','闪!','摸不到~','太快了!','你急了'][dodges%5];
    if(dodges===3)fakeBSOD();
    if(dodges>=6){b.textContent='好吧…点我(真的)';b.onmouseenter=null;b.ontouchstart=null;}
   }
   b.onclick=function(){
    if(lvl!==5)return;
    if(dodges<6){tele();return;}
    win();
   };
  }
  function fakeBSOD(){
   var bs=document.getElementById('bsod');
   document.getElementById('bsodJoke').textContent='错误代码: CHOCOLATE_NOT_FOUND —— 恭喜气到系统蓝屏(假的,3秒后回来)';
   bs.style.display='block';SFX.lose();
   setTimeout(function(){bs.style.display='none';},3000);
  }
  function next(){
   SFX.unlock();q.onclick=null;stage.onclick=null;
   var b=document.getElementById('trollBtn');if(b)b.remove();
   lvl++;upd();
   if(lvl===2)lv2();else if(lvl===3)lv3();else if(lvl===4)lv4();else if(lvl===5)lv5();
  }
  function win(){
   lvl=6;upd();
   q.textContent='🏆 恭喜! 你击败了这个没有心的游戏!';
   area.innerHTML='<div style="font-size:60px">🍫🍫🍫</div><div class="sub">被整'+trolled+'次还能笑着通关,授予「心态大师」称号!<br>奖励巧克力已到账~</div>';
   document.getElementById('hint').textContent='其实第2关的正确答案是：别信出题人。';
   Site.winGame('被整'+trolled+'次');
   localStorage.setItem('troll_clear',Date.now());
   SFX.win();
  }
  document.getElementById('newBtn').onclick=function(){
   SFX.click();
   Site.beginGame('😤 永远差一点',{},function(){
    lvl=1;trolled=0;escapes=0;upd();
    q.onclick=null;stage.onclick=null;
    var b=document.getElementById('trollBtn');if(b)b.remove();
    lv1();
   });
  };
  Site.beginGame('😤 永远差一点',{},lv1);
  upd();
})();
</script>
</body>
</html>
