<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛇梯棋 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  #gameCanvas { background:#2e7d32; touch-action:none; cursor:pointer; }
  .key { display:inline-block; background:var(--mc-panel); border:2px solid #000; box-shadow: inset -2px -2px 0 0 var(--mc-shadow), inset 2px 2px 0 0 var(--mc-highlight); padding:3px 8px; font-family:'Press Start 2P',monospace; font-size:10px; margin:0 2px; }
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="snakes.html">蛇梯棋</a>
    <a href="ludo.html">飞行棋</a>
    <a href="checkers.html">跳棋</a>
    <a href="gomoku.html">五子棋</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:34px;">🐍🪜 蛇梯棋</h1>
  <p class="subtitle">梯子爬上天 · 撞蛇滑到底 · 踩中对手送回起点！</p>
  <div class="hud" style="margin-top:18px;">
    <div class="hud-item"><span class="label">回合</span><span id="turnTxt">你的回合</span></div>
    <div class="hud-item"><span class="label">🎲骰子</span><span id="diceTxt">-</span></div>
    <div class="hud-item"><span class="label">⛏你</span><span id="pTxt">起点</span></div>
    <div class="hud-item"><span class="label">👾AI</span><span id="aTxt">起点</span></div>
    <div class="hud-item"><span class="label">战绩</span><span id="recTxt">0-0</span></div>
  </div>
  <div class="game-stage" style="margin-top:14px;"><canvas id="gameCanvas" width="500" height="560"></canvas></div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:15px;margin-top:12px;">
    <span class="key">掷骰</span>前进 · <span class="key">🪜梯子</span>爬上去 · <span class="key">🐍蛇</span>滑下来 · 到100需<span class="key">精确点数</span>否则反弹 · 掷6再掷一次！
  </p>
  <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn gold" id="rollBtn">🎲 掷骰子</button>
    <button class="mc-btn green" id="newBtn">🔄 新对局</button>
    <a href="index.html" class="mc-btn">← 返回大厅</a>
  </div>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var BOARD=500,CELL=BOARD/10,DIE_H=H-BOARD;
  var LADDERS={3:22,8:30,28:76,36:57,51:88,65:85,71:92};
  var SNAKES={17:7,39:21,54:31,62:18,64:42,87:45,93:68,98:79};
  var p,a,cur,dice,phase,record,animT,slide;
  function cellXY(n){
   n=Math.max(1,Math.min(100,n));
   var i=n-1,row=Math.floor(i/10),col=i%10;
   if(row%2===1)col=9-col; // 蛇形编号
   return {x:col*CELL+CELL/2,y:BOARD-(row*CELL)-CELL/2,n:n};
  }
  function init(){
   p={pos:1};a={pos:1};cur=0;dice=0;phase='idle';animT=null;slide=null;
   record={w:parseInt(localStorage.getItem('snakeL_w')||'0'),l:parseInt(localStorage.getItem('snakeL_l')||'0')};
   updateHud();
  }
  function posName(n){return n===1?'起点':n===100?'🏆100':String(n);}
  function updateHud(){
   document.getElementById('turnTxt').textContent=phase==='over'?(p.pos===100?'🎉 你赢!':'💀 AI赢'):(cur===0?(phase==='idle'?'你的回合 · 掷骰子':'你移动中...'):'AI 思考中...');
   document.getElementById('diceTxt').textContent=dice||'-';
   document.getElementById('pTxt').textContent=posName(p.pos);
   document.getElementById('aTxt').textContent=posName(a.pos);
   document.getElementById('recTxt').textContent=record.w+'-'+record.l;
   document.getElementById('rollBtn').style.display=(cur===0&&phase==='idle')?'':'none';
  }
  function roll(){
   if(phase!=='idle')return;
   dice=1+Math.floor(Math.random()*6);SFX.click();
   if(dice===6)SFX.coin();
   phase='anim';updateHud();
   var who=cur===0?p:a,name=cur===0?'你':'AI';
   // 逐步前进动画(超过100: 走到100再反弹回来)
   var steps=0,dir=1;
   animT=setInterval(function(){
    steps++;
    if(dir===1){who.pos++;SFX.move();if(who.pos===100&&steps<dice)dir=-1;}
    else{who.pos--;SFX.move();}
    updateHud();draw();
    if(steps>=dice){clearInterval(animT);setTimeout(afterMove,350);}
   },170);
  }
  function afterMove(){
   var who=cur===0?p:a,name=cur===0?'你':'AI';
   // 踩中对手 → 送回起点
   var other=cur===0?a:p;
   if(who.pos===other.pos&&who.pos>1){
    other.pos=1;SFX.hit();
    toast(name+' 踩中对手! 对方被送回起点!');
   }
   // 梯子/蛇
   if(LADDERS[who.pos]){
    var up=LADDERS[who.pos];
    glide(who,up,function(){
     SFX.unlock();toast((cur===0?'你':'AI')+' 🪜爬梯 '+who.pos+'→'+up+'!');
     endMove();
    });
    return;
   }
   if(SNAKES[who.pos]){
    var dn=SNAKES[who.pos];
    glide(who,dn,function(){
     SFX.lose();toast((cur===0?'你':'AI')+' 🐍被蛇咬 '+who.pos+'→'+dn+'!');
     endMove();
    });
    return;
   }
   endMove();
  }
  function glide(who,target,cb){
   var from=who.pos,steps=10,i=0;
   slide=setInterval(function(){
    i++;who.pos=Math.round(from+(target-from)*i/steps);draw();updateHud();
    if(i>=steps){clearInterval(slide);slide=null;who.pos=target;draw();cb();}
   },40);
  }
  function endMove(){
   var who=cur===0?p:a;
   if(who.pos===100){phase='over';
    if(cur===0){record.w++;localStorage.setItem('snakeL_w',record.w);SFX.win();}
    else{record.l++;localStorage.setItem('snakeL_l',record.l);SFX.lose();}
    toast(cur===0?'🎉 你先到100! 获胜!':'💀 AI先到100...');
    updateHud();draw();return;
   }
   var extra=(dice===6);
   if(!extra)cur=1-cur;
   dice=0;phase='idle';updateHud();draw();
   if(cur===1)setTimeout(function(){roll();},900);
   else if(extra)toast('掷到6! 再掷一次~');
  }
  function toast(t){
   var e=document.getElementById('toast');
   if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000;color:#ffd700;padding:8px 18px;border:2px solid #ffd700;z-index:99;font-size:14px';document.body.appendChild(e);}
   e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},2200);
  }
  // ===== 绘制 =====
  function draw(){
   ctx.clearRect(0,0,W,H);
   // 棋盘格
   for(var i=0;i<100;i++){
    var c=cellXY(i+1),x=c.x-CELL/2,y=c.y-CELL/2;
    var row=Math.floor(i/10);
    ctx.fillStyle=row%2===0?'#43a047':'#388e3c';
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,CELL-1,CELL-1);
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(String(i+1),x+3,y+3);
   }
   // 梯子
   ctx.strokeStyle='#8d5524';ctx.lineWidth=5;ctx.lineCap='round';
   Object.keys(LADDERS).forEach(function(s){
    var f=cellXY(+s),t=cellXY(LADDERS[s]);
    var dx=t.x-f.x,dy=t.y-f.y,L=Math.hypot(dx,dy),nx=-dy/L*9,ny=dx/L*9;
    ctx.beginPath();ctx.moveTo(f.x+nx,f.y+ny);ctx.lineTo(t.x+nx,t.y+ny);
    ctx.moveTo(f.x-nx,f.y-ny);ctx.lineTo(t.x-nx,t.y-ny);ctx.stroke();
    ctx.lineWidth=3;
    var rungs=Math.floor(L/16);
    for(var r=1;r<rungs;r++){
     var rr=r/rungs;
     ctx.beginPath();ctx.moveTo(f.x+nx+(dx*rr),f.y+ny+(dy*rr));ctx.lineTo(f.x-nx+(dx*rr),f.y-ny+(dy*rr));ctx.stroke();
    }
    ctx.lineWidth=5;
   });
   // 蛇
   Object.keys(SNAKES).forEach(function(s){
    var f=cellXY(+s),t=cellXY(SNAKES[s]);
    var mx=(f.x+t.x)/2+(f.y<t.y?26:-26),my=(f.y+t.y)/2+(f.x<t.x?-26:26);
    ctx.strokeStyle='#6a1b9a';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.quadraticCurveTo(mx,my,t.x,t.y);ctx.stroke();
    ctx.strokeStyle='#9c27b0';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.quadraticCurveTo(mx,my,t.x,t.y);ctx.stroke();
    // 蛇头
    ctx.beginPath();ctx.arc(f.x,f.y,8,0,7);ctx.fillStyle='#6a1b9a';ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x-3,f.y-2,2,0,7);ctx.arc(f.x+3,f.y-2,2,0,7);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(f.x-3,f.y-2,1,0,7);ctx.arc(f.x+3,f.y-2,1,0,7);ctx.fill();
   });
   // 终点
   var g=cellXY(100);
   ctx.fillStyle='rgba(255,215,0,.25)';ctx.fillRect(g.x-CELL/2,g.y-CELL/2,CELL,CELL);
   ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillStyle='#ffd700';ctx.fillText('🏆',g.x,g.y);
   // 棋子
   drawToken(a.pos,'#ce93d8','👾',12);
   drawToken(p.pos,'#ffd700','⛏',-12);
   // 骰子区
   ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,BOARD,W,DIE_H);
   drawDie(W/2,BOARD+DIE_H/2,44);
   if(cur===0&&phase==='idle'){
    var pulse=Math.abs(Math.sin(Date.now()/250));
    ctx.strokeStyle='rgba(255,215,0,'+(0.4+pulse*0.6)+')';ctx.lineWidth=4;
    ctx.strokeRect(W/2-26,BOARD+DIE_H/2-26,52,52);
   }
   requestAnimationFrame(draw);
  }
  function drawToken(pos,col,emo,off){
   var c=cellXY(pos);
   ctx.save();ctx.translate(c.x+off*.6,c.y+off*.35);
   ctx.beginPath();ctx.arc(0,0,13,0,7);
   ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();
   ctx.lineWidth=1;ctx.strokeStyle='#000';ctx.stroke();
   ctx.font='13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillStyle='#000';ctx.fillText(emo,0,1);
   ctx.restore();
  }
  function drawDie(x,y,s){
   ctx.fillStyle='#fff';ctx.fillRect(x-s/2,y-s/2,s,s);
   ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeRect(x-s/2,y-s/2,s,s);
   ctx.fillStyle='#000';
   var m=[[],[5],[1,9],[1,5,9],[1,3,7,9],[1,3,5,7,9],[1,3,4,6,7,9]][dice]||[];
   m.forEach(function(n){
    var r=Math.floor((n-1)/3),c=(n-1)%3;
    ctx.beginPath();ctx.arc(x-s/2+8+c*(s-16)/2,y-s/2+8+r*(s-16)/2,3.5,0,7);ctx.fill();
   });
  }
  canvas.addEventListener('click',function(ev){
   var r=canvas.getBoundingClientRect();
   var my=(ev.clientY-r.top)*(H/r.height);
   if(cur===0&&phase==='idle'&&my>BOARD){roll();}
  });
  document.getElementById('rollBtn').onclick=roll;
  document.getElementById('newBtn').onclick=function(){SFX.click();init();};
  init();draw();
  setTimeout(function(){toast('看准梯子避开蛇, 冲向100!');},600);
})();
</script>
</body>
</html>
