<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直升机洞穴 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  #gameCanvas { background:#2a1a0a; touch-action:none; }
  .key { display:inline-block; background:var(--mc-panel); border:2px solid #000; box-shadow: inset -2px -2px 0 0 var(--mc-shadow), inset 2px 2px 0 0 var(--mc-highlight); padding:3px 8px; font-family:'Press Start 2P',monospace; font-size:10px; margin:0 2px; }
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="flappy.html">像素鸟</a>
    <a href="penguin.html">企鹅滑行</a>
    <a href="copter.html">直升机</a>
    <a href="asteroids.html">太空陨石</a>
    <a href="dodge.html">弹幕</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:34px;">🚁 直升机洞穴</h1>
  <p class="subtitle">按住上升，松开下落！穿越布满障碍的洞穴</p>
  <div class="hud" style="margin-top:20px;">
    <div class="hud-item"><span class="label">距离</span><span id="score">0</span>m</div>
    <div class="hud-item"><span class="label">生命</span><span id="lives">♥♥♥</span></div>
    <div class="hud-item"><span class="label">金币</span><span id="coins">0</span></div>
    <div class="hud-item"><span class="label">最远</span><span id="best">0</span>m</div>
  </div>
  <div class="game-stage" style="margin-top:14px;"><canvas id="gameCanvas" width="560" height="440"></canvas></div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:16px;margin-top:12px;">
    按住<span class="key">空格</span>或鼠标/触摸 = 上升，松开 = 下落 · 收集金币
  </p>
  <div style="margin-top:14px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
    <button class="mc-btn green" id="startBtn">▶ 开始游戏</button>
    <a href="index.html" class="mc-btn">← 返回大厅</a>
  </div>
</div>
<div class="ground" style="position:fixed; bottom:0; left:0; right:0; z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var state, copter, coins, parts, keys, holding, tick, scroll, ceiling, floorY, gapY, gapH, obsT, obstacles;
  function getBest(){return parseInt(localStorage.getItem('copter_best')||'0',10);}
  function setBest(v){localStorage.setItem('copter_best',v);}
  function init(){
    state={running:false,over:false,score:0,lives:3,coins:0};
    copter={x:100,y:H/2,vy:0,r:14,rot:0,inv:0};
    coins=[]; parts=[]; keys={}; holding=false; tick=0; scroll=0;
    ceiling=0; floorY=H; gapY=H/2; gapH=240; obsT=0; obstacles=[];
    updateHud();
  }
  function updateHud(){
    document.getElementById('score').textContent=state.score;
    document.getElementById('lives').textContent='♥'.repeat(Math.max(0,state.lives))||'—';
    document.getElementById('coins').textContent=state.coins;
    document.getElementById('best').textContent=getBest();
  }
  function fx(x,y,c,n){n=n||8;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:20,c:c,size:2+Math.random()*3});}}
  function update(){
    if(!state.running||state.over)return;
    tick++;
    var sp=3+state.score*0.01;
    scroll+=sp;
    // 直升机物理
    if(holding){copter.vy-=0.35;}
    copter.vy+=0.18; copter.vy=Math.max(-6,Math.min(7,copter.vy));
    copter.y+=copter.vy; copter.rot=copter.vy*0.05;
    if(copter.inv>0)copter.inv--;
    // 排气粒子
    if(tick%2===0)parts.push({x:copter.x-14,y:copter.y+2,vx:-sp+Math.random()*-1,vy:(Math.random()-0.5),life:16,c:'#9e9e9e',size:3});
    // 洞穴地形（正弦波）
    var targetGap = H/2 + Math.sin(tick*0.01)*60 + Math.sin(tick*0.003)*40;
    gapY += (targetGap-gapY)*0.05;
    gapH = Math.max(150, 240-state.score*0.15);
    ceiling = gapY - gapH/2;
    floorY = gapY + gapH/2;
    // 障碍（钟乳石/石笋）
    obsT++;
    if(obsT>Math.max(60,110-state.score*0.1)){obsT=0;
      var fromTop=Math.random()<0.5;
      var len=30+Math.random()*60;
      obstacles.push({x:W+20,y:fromTop?ceiling:floorY-len,len:len,fromTop:fromTop,hit:false});
    }
    obstacles.forEach(function(o){o.x-=sp;});
    obstacles=obstacles.filter(function(o){return o.x>-30;});
    // 金币
    if(tick%50===0){coins.push({x:W+20,y:ceiling+20+Math.random()*(gapH-40),r:8,t:0});}
    coins.forEach(function(c){c.x-=sp;c.t+=0.15;});
    // 收集金币
    coins=coins.filter(function(c){
      if(Math.hypot(c.x-copter.x,c.y-copter.y)<copter.r+c.r){state.coins++;state.score+=2;fx(c.x,c.y,'#ffd700',6);SFX.coin();updateHud();return false;}
      return c.x>-20;
    });
    // 撞地形/障碍
    if(copter.inv<=0){
      var hit=false;
      if(copter.y-copter.r<ceiling||copter.y+copter.r>floorY)hit=true;
      obstacles.forEach(function(o){
        if(o.fromTop){if(copter.x+copter.r>o.x-8&&copter.x<o.x+8&&copter.y-copter.r<o.y+o.len)hit=true;}
        else {if(copter.x+copter.r>o.x-8&&copter.x<o.x+8&&copter.y+copter.r>o.y)hit=true;}
      });
      if(hit){state.lives--;copter.inv=50;copter.vy=-3;fx(copter.x,copter.y,'#e53935',12);SFX.hurt();updateHud();if(state.lives<=0)gameOver();}
    }
    state.score++; if(tick%10===0)updateHud();
    for(var p=parts.length-1;p>=0;p--){var pt=parts[p];pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;if(pt.life<=0)parts.splice(p,1);}
  }
  function gameOver(){state.over=true;state.running=false;AOXSound.stopBGM();SFX.lose();if(state.score>getBest()){setBest(state.score);toast('🏆 新纪录'+state.score+'m！');}}
  function draw(){
    // 背景（洞壁深色）
    ctx.fillStyle='#2a1a0a'; ctx.fillRect(0,0,W,H);
    // 远处火光
    for(var i=0;i<8;i++){var fx2=(i*80-scroll*0.3)%W; if(fx2<0)fx2+=W; ctx.fillStyle='rgba(255,87,34,0.05)'; ctx.fillRect(fx2,H*0.3,60,20);}
    // 粒子
    parts.forEach(function(p){ctx.globalAlpha=p.life/20;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1;});
    // 顶部地形
    ctx.fillStyle='#5d3a1a';
    ctx.beginPath(); ctx.moveTo(0,0);
    for(var x=0;x<=W;x+=10){var y=ceiling+Math.sin((x+scroll)*0.02)*8; ctx.lineTo(x,y);}
    ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#3d2817'; ctx.fillRect(0,0,W,ceiling-8);
    // 底部地形
    ctx.fillStyle='#5d3a1a';
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x2=0;x2<=W;x2+=10){var y2=floorY+Math.sin((x2+scroll)*0.02)*8; ctx.lineTo(x2,y2);}
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#3d2817'; ctx.fillRect(0,floorY+8,W,H);
    // 障碍
    obstacles.forEach(function(o){
      ctx.fillStyle='#7f7f7f';
      if(o.fromTop){ctx.beginPath();ctx.moveTo(o.x-8,o.y);ctx.lineTo(o.x+8,o.y);ctx.lineTo(o.x,o.y+o.len);ctx.fill();}
      else {ctx.beginPath();ctx.moveTo(o.x-8,o.y+o.len);ctx.lineTo(o.x+8,o.y+o.len);ctx.lineTo(o.x,o.y);ctx.fill();}
    });
    // 金币
    coins.forEach(function(c){ctx.fillStyle='#ffd700';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('💰',c.x,c.y+6);});
    // 直升机
    if(copter.inv>0&&tick%4>=2){ctx.globalAlpha=0.3;}
    ctx.save(); ctx.translate(copter.x,copter.y); ctx.rotate(copter.rot);
    // 机身
    ctx.fillStyle='#1565c0'; ctx.fillRect(-14,-6,24,12);
    ctx.fillStyle='#0d47a1'; ctx.fillRect(-14,2,24,4);
    // 玻璃
    ctx.fillStyle='#4dd0e1'; ctx.fillRect(4,-5,8,9);
    // 尾翼
    ctx.fillStyle='#1565c0'; ctx.fillRect(-24,-2,10,4);
    ctx.fillStyle='#0d47a1'; ctx.fillRect(-26,-6,4,10);
    // 起落架
    ctx.fillStyle='#5d3a1a'; ctx.fillRect(-10,6,3,5); ctx.fillRect(6,6,3,5);
    ctx.fillRect(-12,10,18,2);
    // 旋翼（旋转）
    ctx.fillStyle='#333'; ctx.strokeStyle='#333'; ctx.lineWidth=3;
    var rl=Math.sin(tick*0.6)*22;
    ctx.beginPath(); ctx.moveTo(rl,-10); ctx.lineTo(-rl,-10); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1;
    // 结算
    if(!state.running){
      ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
      if(state.over){ctx.fillStyle='#e53935';ctx.font='24px "Press Start 2P",monospace';ctx.fillText('坠毁',W/2,H/2-15);ctx.fillStyle='#ffd700';ctx.font='12px "Press Start 2P",monospace';ctx.fillText('距离:'+state.score+'m 金币:'+state.coins,W/2,H/2+20);}
      else {ctx.fillStyle='#ffd700';ctx.font='22px "Press Start 2P",monospace';ctx.fillText('直升机洞穴',W/2,H/2-10);ctx.fillStyle='#fff';ctx.font='11px "Press Start 2P",monospace';ctx.fillText('按住上升',W/2,H/2+25);}
    }
  }
  function loop(){update();draw();requestAnimationFrame(loop);}
  function press(e){if(e)e.preventDefault();if(!state.running)return;holding=true;AOXSound.ensure();}
  function release(e){if(e)e.preventDefault();holding=false;}
  document.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();press();}});
  document.addEventListener('keyup',function(e){if(e.key===' ')release();});
  canvas.addEventListener('mousedown',press); window.addEventListener('mouseup',release);
  canvas.addEventListener('touchstart',press,{passive:false}); canvas.addEventListener('touchend',release,{passive:false});
  document.getElementById('startBtn').addEventListener('click',function(){init();state.running=true;AOXSound.ensure();AOXSound.startBGM('game');SFX.select();});
  init(); loop();
})();
</script>
</body>
</html>
