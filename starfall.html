<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星穹弹幕 · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:#020108; }
  #gameCanvas { background:#020108; touch-action:none; border:3px solid #1a237e; box-shadow:0 0 44px #3949ab55, inset 0 0 80px #0d1045; border-radius:8px; }
  .key { display:inline-block; background:var(--mc-panel); border:2px solid #000; box-shadow: inset -2px -2px 0 0 var(--mc-shadow), inset 2px 2px 0 0 var(--mc-highlight); padding:3px 8px; font-family:'Press Start 2P',monospace; font-size:10px; margin:0 2px; }
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="starfall.html">星穹弹幕</a>
    <a href="asteroids.html">小行星带</a>
    <a href="neonsnake.html">霓虹双蛇</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:34px;">🌌 星穹弹幕</h1>
  <p class="subtitle">穿梭星海扫荡敌舰！自动开火，专注走位躲弹幕~</p>
  <div class="hud" style="margin-top:18px;">
    <div class="hud-item"><span class="label">分数</span><span id="score">0</span></div>
    <div class="hud-item"><span class="label">波次</span><span id="wave">1</span></div>
    <div class="hud-item"><span class="label">护盾</span><span id="lives">❤❤❤</span></div>
    <div class="hud-item"><span class="label">连击</span><span id="combo">-</span></div>
  </div>
  <div class="game-stage" style="margin-top:14px;"><canvas id="gameCanvas" width="480" height="640"></canvas></div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:15px;margin-top:12px;">
    P1 <span class="key">鼠标/触摸/方向键</span> · P2 <span class="key">WASD</span> · 🔺v三向 🛡s护盾 🤖a僚机 · 自动开火!
  </p>
  <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn green" id="newBtn">🔄 再来一局</button>
    <a href="index.html" class="mc-btn">← 返回大厅</a>
  </div>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var ships,bullets,ebullets,enemies,parts,rings,pows,stars3,frame,wave,score,lives,combo,comboT,over,shake,duo,enemyAI,allyAI,boss,waveT;
  function init(){
   ships=[{x:W/2,y:H-90,r:14,trail:[],fireT:0,pow:[],cls:'p1',name:'你',inv:60}];
   if(duo)ships.push({x:W/2-60,y:H-90,r:14,trail:[],fireT:0,pow:[],cls:'p2',name:'P2',inv:60,keys:{}});
   if(allyAI){ships.push({x:W/2+60,y:H-90,r:12,trail:[],fireT:0,pow:['wing'],cls:'ally',name:'🤝'+allyAI.name,inv:60,ai:1});}
   bullets=[];ebullets=[];enemies=[];parts=[];rings=[];pows=[];frame=0;wave=1;score=0;lives=3;combo=0;comboT=0;over=false;shake=0;boss=null;waveT=0;
   stars3=[[],[],[]];
   for(var L=0;L<3;L++)for(var i=0;i<30;i++)stars3[L].push({x:Math.random()*W,y:Math.random()*H,s:[.4,.9,1.6][L]});
   updHud();spawnWave();
  }
  function begin(info){duo=info.duo;enemyAI=info.enemy;allyAI=info.ally;init();}
  function updHud(){
   document.getElementById('score').textContent=score;
   document.getElementById('wave').textContent=wave;
   document.getElementById('lives').textContent='❤'.repeat(Math.max(0,lives))||'💀';
   document.getElementById('combo').textContent=combo>=2?('x'+combo):'-';
  }
  function spawnWave(){
   waveT=180;
   if(wave%5===0){ // Boss
    boss={x:W/2,y:-80,r:46,hp:40+wave*4,maxhp:40+wave*4,t:0,name:enemyAI?enemyAI.name+'的旗舰':'虚空巨兽'};
    toast('⚠ BOSS: '+boss.name+'!');
    return;
   }
   var n=4+wave;
   for(var i=0;i<n;i++){
    enemies.push({x:40+Math.random()*(W-80),y:-30-Math.random()*260,r:12+Math.random()*6,
     hp:wave>=6?2:1,t:Math.random()*99,type:Math.random()<.25?'zig':'dive',fireT:60+Math.random()*120});
   }
  }
  function boom(x,y,hue,n,big){
   for(var i=0;i<n;i++){
    var a=Math.random()*6.28,v=1+Math.random()*(big?5:3);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:25+Math.random()*30,hue:hue,r:1.5+Math.random()*(big?3.5:2)});
   }
   rings.push({x:x,y:y,r:4,max:big?70:32,hue:hue});
  }
  function fire(s){
   var three=s.pow.indexOf('tri')>=0;
   bullets.push({x:s.x,y:s.y-16,vx:0,vy:-9,wing:0});
   if(three){bullets.push({x:s.x-10,y:s.y-8,vx:-1.6,vy:-8.4});bullets.push({x:s.x+10,y:s.y-8,vx:1.6,vy:-8.4});}
   if(s.pow.indexOf('wing')>=0){bullets.push({x:s.x-22,y:s.y+4,vx:0,vy:-7,wing:1});bullets.push({x:s.x+22,y:s.y+4,vx:0,vy:-7,wing:1});}
   SFX.shoot();
  }
  function step(){
   frame++;
   stars3.forEach(function(L,li){L.forEach(function(st){st.y+=st.s*(li+1)*.5;if(st.y>H){st.y=-2;st.x=Math.random()*W;}});});
   if(shake>0)shake*=.88;
   // 玩家
   ships.forEach(function(s){
    if(s.dead)return;
    if(s.inv>0)s.inv--;
    s.trail.unshift({x:s.x,y:s.y+12});if(s.trail.length>10)s.trail.pop();
    if(s.cls==='p1'){ if(s.tx!==undefined&&s.tx!==null){var dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy);if(d>3){s.x+=dx/Math.max(1,d)*5.2;s.y+=dy/Math.max(1,d)*5.2;}} 
     var k=s.keys||{};
     if(k.left)s.x-=5;if(k.right)s.x+=5;if(k.up)s.y-=5;if(k.down)s.y+=5;
    }else if(s.cls==='p2'){
     var k2=s.keys||{};
     if(k2.a)s.x-=5;if(k2.d)s.x+=5;if(k2.w)s.y-=5;if(k2.s)s.y+=5;
    }else if(s.ai){ // 僚机: 跟随P1+自动打
     var L=ships[0];if(L&&!L.dead){var ax=L.x+(s.x>L.x?42:-42),ay=L.y+26;
      var dx3=ax-s.x,dy3=ay-s.y,d3=Math.hypot(dx3,dy3);if(d3>2){s.x+=dx3/d3*4.6;s.y+=dy3/d3*4.6;}}
    }
    s.x=Math.max(14,Math.min(W-14,s.x));s.y=Math.max(30,Math.min(H-14,s.y));
    s.fireT--;
    if(s.fireT<=0){fire(s);s.fireT=7;}
   });
   // 子弹
   bullets.forEach(function(b){b.x+=b.vx;b.y+=b.vy;});
   bullets=bullets.filter(function(b){return b.y>-20&&b.x>-20&&b.x<W+20;});
   // 敌弹
   ebullets.forEach(function(b){b.x+=b.vx;b.y+=b.vy;});
   ebullets=ebullets.filter(function(b){return b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20;});
   // 敌机
   enemies.forEach(function(e){
    e.t+=.03;e.fireT--;
    if(e.type==='zig'){e.y+=1.1;e.x+=Math.sin(e.t*2)*2.4;}
    else{e.y+=(e.y<120?1.6:.55);}
    if(e.fireT<=0&&e.y>0){
     e.fireT=110+Math.random()*100;
     var tgt=ships.filter(function(s){return !s.dead;});
     if(tgt.length){
      var T=tgt[Math.floor(Math.random()*tgt.length)];
      var a=Math.atan2(T.y-e.y,T.x-e.x);
      ebullets.push({x:e.x,y:e.y+10,vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6});
      if(wave>=4){ebullets.push({x:e.x,y:e.y+10,vx:Math.cos(a-.4)*2.6,vy:Math.sin(a-.4)*2.6});
                  ebullets.push({x:e.x,y:e.y+10,vx:Math.cos(a+.4)*2.6,vy:Math.sin(a+.4)*2.6});}
     }
    }
   });
   enemies=enemies.filter(function(e){return e.y<H+40;});
   // Boss
   if(boss){
    boss.t++;if(boss.y<90)boss.y+=1.2;
    boss.x=W/2+Math.sin(boss.t*.02)*(W/2-70);
    if(boss.t%50===0){
     for(var a=0;a<8;a++){var an=a/8*6.28+boss.t*.01;
      ebullets.push({x:boss.x,y:boss.y+30,vx:Math.cos(an)*2.2,vy:Math.sin(an)*2.2+.6});}
     SFX.boom();
    }
    if(boss.t%17===0)ebullets.push({x:boss.x,y:boss.y+40,vx:0,vy:4});
   }
   // 波次推进
   if(!boss&&enemies.length===0){waveT--;if(waveT<=0){wave++;spawnWave();updHud();SFX.unlock();toast('第 '+wave+' 波来袭!');}}
   // 命中判定
   bullets.forEach(function(b){
    if(boss&&!boss.dead&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+b.r*2){
     b.y=-99;boss.hp--;boom(b.x,b.y,50,3);
     if(boss.hp<=0){score+=500;boom(boss.x,boss.y,280,60,true);shake=14;SFX.boom();
      pows.push({x:boss.x,y:boss.y,t:'tri'},{x:boss.x+30,y:boss.y,t:'shield'},{x:boss.x-30,y:boss.y,t:'life'});boss=null;toast('🏆 击沉旗舰! +500');updHud();}
     return;
    }
    for(var i=0;i<enemies.length;i++){
     var e=enemies[i];
     if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){
      b.y=-99;e.hp--;
      if(e.hp<=0){
       boom(e.x,e.y,40+Math.random()*80,14);score+=25;combo++;comboT=140;SFX.hit();
       if(Math.random()<.09)pows.push({x:e.x,y:e.y,t:['tri','shield','wing','life'][Math.floor(Math.random()*4)]});
       enemies.splice(i,1);updHud();
      }else boom(b.x,b.y,50,3);
      break;
     }
    }
   });
   bullets=bullets.filter(function(b){return b.y>-20;});
   // 道具
   pows.forEach(function(p){p.y=(p.y||0)+1.2;});
   pows=pows.filter(function(p){
    for(var i=0;i<ships.length;i++){var s=ships[i];if(!s.dead&&Math.hypot(p.x-s.x,p.y-s.y)<s.r+12){
     if(p.t==='life'){if(s.cls==='p1'){lives++;}else s.dead=false;}
     else if(s.pow.indexOf(p.t)<0)s.pow.push(p.t);
     boom(p.x,p.y,180,12);SFX.levelUp();updHud();return false;}}
    return p.y<H+20;});
   // 玩家中弹
   ships.forEach(function(s){
    if(s.dead||s.inv>0)return;
    var shield=s.pow.indexOf('shield')>=0;
    for(var i=0;i<ebullets.length;i++){
     if(Math.hypot(ebullets[i].x-s.x,ebullets[i].y-s.y)<s.r+5){
      ebullets.splice(i,1);
      if(shield){s.pow.splice(s.pow.indexOf('shield'),1);boom(s.x,s.y,200,10);s.inv=40;toast('护盾碎了!');}
      else hurtShip(s);
      return;
     }
    }
    if(boss&&Math.hypot(s.x-boss.x,s.y-boss.y)<boss.r+s.r){ if(shield){s.pow.splice(s.pow.indexOf('shield'),1);s.inv=50;} else hurtShip(s); }
   });
   // 粒子
   parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life--;});
   parts=parts.filter(function(p){return p.life>0;});
   rings.forEach(function(r){r.r+=(r.max-r.r)*.16;});
   rings=rings.filter(function(r){return r.max-r.r>2;});
   if(comboT>0){comboT--;if(comboT===0){combo=0;}if(frame%10===0)updHud();}
   if(score>0&&frame%15===0)updHud();
  }
  function hurtShip(s){
   boom(s.x,s.y,10,24,true);shake=12;SFX.lose();
   if(s.cls==='p1'){lives--;s.inv=110;updHud();
    if(lives<0){endGame();}}
   else{s.dead=true;toast(s.name+' 被击落!');}
  }
  function endGame(){
   over=true;
   var win=score>=3000;
   if(win)Site.winGame(score+'分');else Site.loseGame();
   if(enemyAI)Site.aiScore(score);
   toast(win?'🏆 星际传奇! '+score+'分':'💥 旗舰坠毁... '+score+'分');
  }
  function drawShip(s){
   if(s.dead)return;
   ctx.save();
   if(s.inv>0&&Math.floor(frame/4)%2===0)ctx.globalAlpha=.35;
   // 拖尾
   s.trail.forEach(function(t,i){
    ctx.globalAlpha=(s.inv>0?.15:.28)*(1-i/10);
    ctx.fillStyle=s.cls==='p1'?'#40c4ff':s.cls==='p2'?'#69f0ae':'#e040fb';
    ctx.beginPath();ctx.arc(t.x,t.y,5*(1-i/12),0,7);ctx.fill();
   });
   ctx.globalAlpha=(s.inv>0&&Math.floor(frame/4)%2===0)?.5:1;
   var col=s.cls==='p1'?'#40c4ff':s.cls==='p2'?'#69f0ae':'#e040fb';
   ctx.shadowColor=col;ctx.shadowBlur=16;
   ctx.fillStyle=col;
   ctx.beginPath();ctx.moveTo(s.x,s.y-16);ctx.lineTo(s.x+12,s.y+12);ctx.lineTo(s.x,s.y+5);ctx.lineTo(s.x-12,s.y+12);ctx.closePath();ctx.fill();
   if(s.pow.indexOf('shield')>=0){
    ctx.shadowBlur=20;ctx.strokeStyle='#80d8ff';ctx.lineWidth=2;ctx.globalAlpha=.7;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r+9,0,7);ctx.stroke();
   }
   ctx.globalAlpha=1;ctx.shadowBlur=0;
   ctx.font='10px monospace';ctx.textAlign='center';
   ctx.fillStyle=col;ctx.fillText(s.name,s.x,s.y+26);
   ctx.restore();
  }
  function draw(){
   ctx.save();
   if(shake>0.4)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
   ctx.fillStyle='#020108';ctx.fillRect(-20,-20,W+40,H+40);
   // 三层星空
   stars3.forEach(function(L,li){
    ctx.fillStyle=['rgba(255,255,255,.25)','rgba(160,190,255,.45)','rgba(255,255,255,.8)'][li];
    L.forEach(function(st){ctx.fillRect(st.x,st.y,st.s+.6,st.s+.6);});
   });
   // 道具
   pows.forEach(function(p){
    ctx.save();ctx.shadowBlur=14;
    var I={tri:'🔺',shield:'🛡',wing:'🤖',life:'❤'}[p.t];
    ctx.shadowColor='#69f0ae';ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I,p.x,p.y);ctx.restore();
   });
   // 敌机
   enemies.forEach(function(e){
    ctx.save();ctx.shadowColor='#ff5252';ctx.shadowBlur=10;
    ctx.fillStyle=e.type==='zig'?'#ff5252':'#ff8a80';
    ctx.beginPath();ctx.moveTo(e.x,e.y+e.r);ctx.lineTo(e.x+e.r,e.y-e.r*.7);ctx.lineTo(e.x-e.r,e.y-e.r*.7);ctx.closePath();ctx.fill();
    ctx.restore();
   });
   // Boss
   if(boss){
    ctx.save();ctx.shadowColor='#d500f9';ctx.shadowBlur=26;
    ctx.fillStyle='#8e24aa';
    ctx.beginPath();ctx.moveTo(boss.x,boss.y+boss.r);ctx.lineTo(boss.x+boss.r,boss.y-boss.r*.4);ctx.lineTo(boss.x,boss.y-boss.r);ctx.lineTo(boss.x-boss.r,boss.y-boss.r*.4);ctx.closePath();ctx.fill();
    ctx.restore();
    // 血条
    ctx.fillStyle='#000';ctx.fillRect(W/2-120,14,240,10);
    ctx.fillStyle='#d500f9';ctx.fillRect(W/2-118,16,236*(boss.hp/boss.maxhp),6);
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText('⚔ '+boss.name,W/2,38);
   }
   // 子弹(玩家=光针 敌=光珠)
   bullets.forEach(function(b){
    ctx.save();ctx.shadowColor=b.wing?'#e040fb':'#40c4ff';ctx.shadowBlur=8;
    ctx.fillStyle=b.wing?'#e040fb':'#e0f7ff';
    ctx.fillRect(b.x-1.5,b.y-7,3,12);ctx.restore();
   });
   ebullets.forEach(function(b){
    ctx.save();ctx.shadowColor='#ff1744';ctx.shadowBlur=10;
    ctx.fillStyle='#ff8a80';
    ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,7);ctx.fill();ctx.restore();
   });
   ships.forEach(drawShip);
   // 冲击波环
   rings.forEach(function(r){
    ctx.save();ctx.globalAlpha=Math.max(.1,1-r.r/r.max);
    ctx.strokeStyle='hsl('+r.hue+',100%,65%)';ctx.lineWidth=3;ctx.shadowColor='hsl('+r.hue+',100%,65%)';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();ctx.restore();
   });
   // 粒子
   parts.forEach(function(p){
    ctx.save();ctx.globalAlpha=Math.min(1,p.life/22);
    ctx.shadowColor='hsl('+p.hue+',100%,65%)';ctx.shadowBlur=8;
    ctx.fillStyle='hsl('+p.hue+',100%,70%)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.restore();
   });
   ctx.restore();
   if(over){
    ctx.fillStyle='rgba(2,1,8,.7)';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.shadowColor='#40c4ff';ctx.shadowBlur=24;
    ctx.fillStyle='#fff';ctx.font='bold 30px monospace';ctx.textAlign='center';
    ctx.fillText('MISSION END',W/2,H/2-8);ctx.restore();
    ctx.fillStyle='#80d8ff';ctx.font='15px monospace';
    ctx.fillText(score+'分 · 第'+wave+'波 · 点「再来一局」',W/2,H/2+26);
   }
  }
  function loop(){ if(!over)step(); draw(); requestAnimationFrame(loop); }
  // 输入: 鼠标/触摸/键盘
  canvas.addEventListener('mousemove',function(ev){
   var r=canvas.getBoundingClientRect();
   var p=ships[0];if(p&&!p.dead){p.tx=(ev.clientX-r.left)*(W/r.width);p.ty=(ev.clientY-r.top)*(H/r.height);}
  });
  canvas.addEventListener('touchmove',function(ev){
   ev.preventDefault();
   var r=canvas.getBoundingClientRect();
   var p=ships[0];if(p&&!p.dead){p.tx=(ev.touches[0].clientX-r.left)*(W/r.width);p.ty=(ev.touches[0].clientY-r.top)*(H/r.height);}
  },{passive:false});
  window.addEventListener('keydown',function(ev){
   var p=ships&&ships[0],p2=ships&&ships[1];
   if(ev.code==='ArrowLeft'&&p)p.keys.left=1;
   if(ev.code==='ArrowRight'&&p)p.keys.right=1;
   if(ev.code==='ArrowUp'&&p)p.keys.up=1;
   if(ev.code==='ArrowDown'&&p)p.keys.down=1;
   if(p2&&p2.cls==='p2'){
    if(ev.code==='KeyW')p2.keys.w=1;if(ev.code==='KeyA')p2.keys.a=1;
    if(ev.code==='KeyS')p2.keys.s=1;if(ev.code==='KeyD')p2.keys.d=1;
   }
  });
  window.addEventListener('keyup',function(ev){
   var p=ships&&ships[0],p2=ships&&ships[1];
   if(ev.code==='ArrowLeft'&&p)p.keys.left=0;
   if(ev.code==='ArrowRight'&&p)p.keys.right=0;
   if(ev.code==='ArrowUp'&&p)p.keys.up=0;
   if(ev.code==='ArrowDown'&&p)p.keys.down=0;
   if(p2&&p2.cls==='p2'){
    if(ev.code==='KeyW')p2.keys.w=0;if(ev.code==='KeyA')p2.keys.a=0;
    if(ev.code==='KeyS')p2.keys.s=0;if(ev.code==='KeyD')p2.keys.d=0;
   }
  });
  document.getElementById('newBtn').onclick=function(){SFX.click();Site.beginGame('🌌 星穹弹幕',{duo:true},begin);};
  function toast(t){var e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e);}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2200);}
  var loopOn=false;
  Site.beginGame('🌌 星穹弹幕',{duo:true},function(info){begin(info);if(!loopOn){loopOn=true;loop();}});
})();
</script>
