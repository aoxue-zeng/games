<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐾 猫狗喂食记 · Pet Feast</title>
<link rel="stylesheet" href="style.css">
<style>
  #gameCanvas { background:linear-gradient(180deg,#87ceeb,#c8ecf8 70%,#8bc34a 70%,#5fb53f); display:block; width:min(500px,100%); height:auto; border-radius:8px; border:3px solid #000; image-rendering:pixelated; touch-action:none; }
  .lang-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0 2px; }
  .lang-btn { font-family:'VT323',monospace; font-size:18px; padding:6px 14px; background:#2b3a55; color:#fff; border:2px solid #4a6080; border-radius:6px; cursor:pointer; }
  .lang-btn.sel { background:#c08020; border-color:#ffd700; box-shadow:0 0 8px #ffd700; }
  .mb-ctrl { display:none; gap:10px; justify-content:center; margin-top:10px; }
  .mb-ctrl button { font-size:30px; width:84px; height:56px; background:#2b3a55; color:#fff; border:3px solid #4a6080; border-radius:10px; touch-action:none; }
  .mb-ctrl button:active { background:#c08020; }
  @media (hover:none) and (pointer:coarse) { .mb-ctrl { display:flex; } }
  @media (max-width:520px) {
    .hud { gap:6px; }
    .hud-item { padding:4px 8px !important; font-size:14px !important; }
    h1.title-3d { font-size:22px !important; }
  }
</style>
</head>
<body>
<div class="floating-blocks"></div>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav>
    <a href="index.html" data-i18n="home">首页</a>
    <a href="petgame.html" data-i18n="title">猫狗喂食记</a>
    <a href="catch.html">接贝壳</a>
    <a href="meteor.html">流星雨</a>
  </nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:30px;" id="pageTitle">🐱 猫狗喂食记 🐶</h1>
  <p class="subtitle" id="pageSub">操控像素小人接住美食：🐟喂猫、🦴喂狗，别接炸弹！</p>

  <div class="lang-row" id="langRow"></div>

  <div class="hud" style="margin-top:12px;">
    <div class="hud-item"><span class="label" data-i18n="score">分数</span><span id="score">0</span></div>
    <div class="hud-item"><span class="label" data-i18n="lives">生命</span><span id="lives">❤❤❤</span></div>
    <div class="hud-item"><span class="label" data-i18n="combo">连击</span><span id="combo">0</span></div>
    <div class="hud-item"><span class="label" data-i18n="level">等级</span><span id="level">1</span></div>
    <div class="hud-item"><span class="label" data-i18n="best">最佳</span><span id="best">0</span></div>
  </div>
  <div class="game-stage" style="margin-top:10px;">
    <canvas id="gameCanvas" width="500" height="600"></canvas>
  </div>

  <div class="mb-ctrl">
    <button id="mbL">◀</button>
    <button id="mbR">▶</button>
  </div>
  <div style="margin-top:12px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn green" id="startBtn">▶ <span data-i18n="start">开始游戏</span></button>
    <a href="index.html" class="mc-btn">← <span data-i18n="back">返回大厅</span></a>
  </div>
  <p style="color:#fff;text-shadow:2px 2px 0 #000;font-size:14px;margin-top:10px;" id="howto">
    ← → / A D / 鼠标 / 触屏 移动 · 🐟喂猫 🦴喂狗 ❤+1命 💣扣血 · 双双喂满升级！
  </p>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  // ===== 多语言 =====
  var LANGS=[
    {id:'zh',flag:'🇨🇳',n:'中文'},
    {id:'en',flag:'🇺🇸',n:'English'},
    {id:'ja',flag:'🇯🇵',n:'日本語'},
    {id:'es',flag:'🇪🇸',n:'Español'}
  ];
  var L={
   zh:{
    home:'首页',title:'🐱 猫狗喂食记 🐶',sub:'接住天上掉的美食：🐟喂猫、🦴喂狗，别接炸弹！',
    score:'分数',lives:'生命',combo:'连击',level:'等级',best:'最佳',start:'开始游戏',back:'返回大厅',
    howto:'← → / A D / 鼠标 / 触屏 移动 · 🐟喂猫 🦴喂狗 ❤+1命 💣扣血 · 双双喂满升级！',
    catName:'咪咪',catKind:'橘猫',dogName:'旺财',dogKind:'柴犬',happy:'开心',
    menu1:'接住美食，喂饱两位毛孩子！',menu2:'🐟给猫 · 🦴给狗 · 💣别接 · ❤回血',
    tapLang:'🌐 选择语言 / Language / 言語 / Idioma',
    over:'游戏结束',scoreTxt:'得分',comboToast:function(n){return '连击 x'+n+'！';},
    lvup:function(n){return '🎉 两位都吃饱啦！升级 Lv.'+n+'，奖励 +50 分！';},
    catHungry:'咪咪饿得喵喵大哭…',dogHungry:'旺财饿得汪汪直叫…',bomb:'被炸弹炸到了…',
    revive:'复活',newBest:'新纪录！'
   },
   en:{
    home:'Home',title:'🐱 Pet Feast 🐶',sub:'Catch falling treats: 🐟 for the cat, 🦴 for the dog — dodge the bombs!',
    score:'Score',lives:'Lives',combo:'Combo',level:'Level',best:'Best',start:'Start',back:'Lobby',
    howto:'← → / A D / mouse / touch to move · 🐟cat 🦴dog ❤+1 life 💣ouch · Fill both meters to level up!',
    catName:'Mimi',catKind:'Ginger Cat',dogName:'Lucky',dogKind:'Shiba Inu',happy:'Happy',
    menu1:'Catch treats and feed two fur babies!',menu2:'🐟 cat · 🦴 dog · 💣 no! · ❤ heals',
    tapLang:'🌐 Choose your language',
    over:'GAME OVER',scoreTxt:'Score',comboToast:function(n){return 'Combo x'+n+'!';},
    lvup:function(n){return '🎉 Both are full! Level '+n+' · +50 bonus!';},
    catHungry:'Mimi is crying from hunger...',dogHungry:'Lucky is howling from hunger...',bomb:'Boom! Caught a bomb...',
    revive:'Respawn',newBest:'New Best!'
   },
   ja:{
    home:'ホーム',title:'🐱 わんにゃん食事タイム 🐶',sub:'落ちてくるごはんをキャッチ！🐟は猫、🦴は犬、💣はさけて！',
    score:'スコア',lives:'ライフ',combo:'コンボ',level:'レベル',best:'最高',start:'スタート',back:'ロビー',
    howto:'← → / A D / マウス / タッチで移動 · 🐟猫 🦴犬 ❤回復 💣ダメージ · 2匹満腹でレベルアップ！',
    catName:'ミミ',catKind:'茶トラ',dogName:'ラッキー',dogKind:'柴犬',happy:'きぶん',
    menu1:'落下するごはんを受けて、2匹のおなかを満たそう！',menu2:'🐟猫 · 🦴犬 · 💣ダメ · ❤回復',
    tapLang:'🌐 言語をえらぶ',
    over:'ゲームオーバー',scoreTxt:'スコア',comboToast:function(n){return 'コンボ x'+n+'！';},
    lvup:function(n){return '🎉 2匹とも満腹！Lv.'+n+' · +50ボーナス！';},
    catHungry:'ミミがおなかをすかせてないている…',dogHungry:'ラッキーがおなかをすかせてほえている…',bomb:'バクダンにあたった…',
    revive:'ふっかつ',newBest:'新記録！'
   },
   es:{
    home:'Inicio',title:'🐱 Fiesta de Mascotas 🐶',sub:'¡Atrapa la comida: 🐟 para el gato, 🦴 para el perro, evita las 💣!',
    score:'Puntos',lives:'Vidas',combo:'Combo',level:'Nivel',best:'Récord',start:'¡Jugar!',back:'Vestíbulo',
    howto:'← → / A D / ratón / táctil · 🐟gato 🦴perro ❤+1 vida 💣¡no! · Llena ambos medidores para subir',
    catName:'Mimi',catKind:'Gato Naranja',dogName:'Fortuno',dogKind:'Perro Shiba',happy:'Feliz',
    menu1:'¡Atrapa comida y alimenta a dos peluditos!',menu2:'🐟 gato · 🦴 perro · 💣 ¡no! · ❤ cura',
    tapLang:'🌐 Elige tu idioma',
    over:'FIN DEL JUEGO',scoreTxt:'Puntos',comboToast:function(n){return '¡Combo x'+n+'!';},
    lvup:function(n){return '🎉 ¡Ambos llenos! Nivel '+n+' · ¡+50 de bonus!';},
    catHungry:'Mimi llora de hambre...',dogHungry:'Fortuno aúlla de hambre...',bomb:'¡Boom! Una bomba...',
    revive:'Revivir',newBest:'¡Nuevo récord!'
   }
  };
  var lang=localStorage.getItem('petgame_lang')||'zh';
  if(!L[lang])lang='zh';
  function t(k){var v=(L[lang]&&L[lang][k])!==undefined?L[lang][k]:L.zh[k];return v===undefined?k:v;}
  // 语言按钮
  var langRow=document.getElementById('langRow');
  LANGS.forEach(function(lg){
    var b=document.createElement('button');
    b.className='lang-btn'+(lg.id===lang?' sel':'');
    b.textContent=lg.flag+' '+lg.n;
    b.onclick=function(){
      lang=lg.id;localStorage.setItem('petgame_lang',lang);
      langRow.querySelectorAll('.lang-btn').forEach(function(z){z.classList.remove('sel');});
      b.classList.add('sel');applyLang();SFX.click();
    };
    langRow.appendChild(b);
  });
  function applyLang(){
    document.documentElement.lang={zh:'zh-CN',en:'en',ja:'ja',es:'es'}[lang];
    document.title='🐾 '+t('title')+' · AoXuan';
    document.getElementById('pageTitle').textContent=t('title');
    document.getElementById('pageSub').textContent=t('sub');
    document.getElementById('howto').textContent=t('howto');
    document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=t(e.dataset.i18n);});
    updateHud();
  }

  // ===== 游戏 =====
  var canvas=document.getElementById('gameCanvas');
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var state,hero,items,parts,pets,keys,mouse,spawnTick,best,t0,started=false;
  best=parseInt(localStorage.getItem('petgameBest')||'0',10);

  function blk(x,y,w,h,color){
    ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(x,y,w,3); ctx.fillRect(x,y,3,h);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(x,y+h-3,w,3); ctx.fillRect(x+w-3,y,3,h);
  }
  function drawHero(x,y,s,tm){
    var bob=Math.sin(tm)*1.5, leg=Math.sin(tm*2)*3;
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    blk(2,10+bob,20,18,'#3d8b2a');
    blk(4,0+bob,16,14,'#f0c8a0');
    blk(4,0+bob,16,4,'#4a2c12');
    ctx.fillStyle='#fff'; ctx.fillRect(12,6+bob,3,3);
    ctx.fillStyle='#000'; ctx.fillRect(13,7+bob,1,2);
    blk(4,28+Math.max(0,leg),6,6,'#1565c0');
    blk(14,28+Math.max(0,-leg),6,6,'#1565c0');
    blk(0,12+bob,4,10,'#3d8b2a');
    blk(20,12+bob,4,10,'#3d8b2a');
    ctx.restore();
    return {w:24*s,h:34*s};
  }
  function drawCat(x,y,s,tm,happy){
    var wag=Math.sin(tm*2.6)*2, blink=(Math.sin(tm*0.7)>0.97);
    var jump=happy>80?Math.abs(Math.sin(tm*4))*-4:0;
    ctx.save(); ctx.translate(x,y+jump); ctx.scale(s,s);
    blk(4,18,4,8,'#d97f1e'); blk(0,8+wag,4,12,'#f5a340');
    blk(8,16,18,11,'#f5a340');
    ctx.fillStyle='#d97f1e'; ctx.fillRect(10,16,2,3); ctx.fillRect(14,16,2,3); ctx.fillRect(18,16,2,3);
    blk(20,26,4,4,'#ffe0b2'); blk(26,26,4,4,'#ffe0b2');
    blk(20,4,16,13,'#f5a340');
    blk(21,1,4,4,'#d97f1e'); blk(31,1,4,4,'#d97f1e');
    ctx.fillStyle='#ff8fa3'; ctx.fillRect(22,2,2,2); ctx.fillRect(32,2,2,2);
    if(happy<=25){
      ctx.fillStyle='#222'; ctx.fillRect(24,8,2,3); ctx.fillRect(31,8,2,3);
      ctx.fillStyle='#4dd0e1'; ctx.fillRect(24,12,2,3);
    } else if(blink){ ctx.fillStyle='#222'; ctx.fillRect(24,10,3,1); ctx.fillRect(30,10,3,1); }
    else{ ctx.fillStyle='#222'; ctx.fillRect(24,8,2,3); ctx.fillRect(31,8,2,3); }
    ctx.fillStyle='#ff8fa3'; ctx.fillRect(28,13,3,2);
    ctx.restore();
    return {w:44*s,h:32*s};
  }
  function drawDog(x,y,s,tm,happy){
    var wag=Math.sin(tm*3.2)*2, blink=(Math.sin(tm*0.9)>0.96);
    var jump=happy>80?Math.abs(Math.sin(tm*3.4))*-5:0;
    ctx.save(); ctx.translate(x,y+jump); ctx.scale(s,s);
    blk(36,12+wag*0.6,4,6,'#8d5524'); blk(38,6+wag,4,8,'#a0652f');
    blk(18,14,18,10,'#8d5524');
    blk(20,24,3,7,'#8d5524'); blk(26,24,3,7,'#8d5524'); blk(32,24,3,7,'#8d5524');
    ctx.fillStyle='#d8a165'; ctx.fillRect(20,28,3,3); ctx.fillRect(26,28,3,3); ctx.fillRect(32,28,3,3);
    blk(8,5,14,12,'#a0652f'); blk(3,10,7,6,'#d8a165');
    ctx.fillStyle='#222'; ctx.fillRect(2,11,3,3);
    if(happy<=25){ ctx.fillStyle='#222'; ctx.fillRect(14,8,2,3); ctx.fillStyle='#4dd0e1'; ctx.fillRect(14,12,2,3); }
    else if(blink){ ctx.fillStyle='#222'; ctx.fillRect(13,10,3,1); }
    else{ ctx.fillStyle='#222'; ctx.fillRect(14,8,2,3); }
    if(happy>25&&Math.sin(tm*1.4)>-0.3){ ctx.fillStyle='#ff8fa3'; ctx.fillRect(5,16,2,4); }
    blk(17,3,5,8,'#6d4118'); blk(10,16,10,2,'#e53935');
    ctx.fillStyle='#ffd700'; ctx.fillRect(14,17,2,2);
    ctx.restore();
    return {w:44*s,h:32*s};
  }
  function bar(x,y,w,v,label,face){
    v=Math.max(0,Math.min(100,v));
    ctx.fillStyle='#000'; ctx.fillRect(x-2,y-2,w+4,14);
    ctx.fillStyle='#37474f'; ctx.fillRect(x,y,w,10);
    var col=v>50?'#4caf50':(v>25?'#ffd700':'#e53935');
    ctx.fillStyle=col; ctx.fillRect(x,y,w*v/100,10);
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(x,y,w*v/100,3);
    ctx.fillStyle='#fff'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText(face+' '+Math.floor(v)+'%',x+w/2,y+24);
    ctx.fillStyle='#ffd700'; ctx.font='10px monospace';
    ctx.fillText(label,x+w/2,y+36);
  }

  function init(){
    state={running:false,over:false,score:0,lives:3,combo:0,level:1};
    hero={x:W/2,y:H-110,s:2.4};
    items=[]; parts=[]; keys={}; mouse={x:W/2,active:false}; spawnTick=0; t0=Date.now();
    pets={cat:{v:70,feed:0,x:14,y:H-118,s:2.2},dog:{v:70,feed:0,x:W-118,y:H-118,s:2.2}};
    updateHud();
  }
  function updateHud(){
    document.getElementById('score').textContent=state?state.score:0;
    document.getElementById('lives').textContent=state?'❤'.repeat(state.lives)+'🖤'.repeat(Math.max(0,3-state.lives)):'❤❤❤';
    document.getElementById('combo').textContent=state?state.combo:0;
    document.getElementById('level').textContent=state?state.level:1;
    document.getElementById('best').textContent=best;
  }
  var TYPES=[
    {t:'fish', icon:'🐟', feed:'cat', w:0.32, vy:2.4, pts:10},
    {t:'bone', icon:'🦴', feed:'dog', w:0.32, vy:2.4, pts:10},
    {t:'goldfish', icon:'🐠', feed:'cat', w:0.05, vy:3.4, pts:25},
    {t:'meat', icon:'🍖', feed:'dog', w:0.05, vy:3.4, pts:25},
    {t:'heart', icon:'❤', w:0.05, vy:2.2, pts:5},
    {t:'bomb', icon:'💣', w:0.21, vy:3.0, pts:-1}
  ];
  function pickType(){
    var r=Math.random(),acc=0;
    for(var i=0;i<TYPES.length;i++){acc+=TYPES[i].w; if(r<acc)return TYPES[i];}
    return TYPES[0];
  }
  function spawn(){
    var t=pickType();
    items.push({x:30+Math.random()*(W-60),y:-24,vy:t.vy*(1+(state.level-1)*0.18+state.score/600),type:t,rot:Math.random()*6,vr:(Math.random()-0.5)*0.15});
  }
  function burst(x,y,emoji,n){
    for(var i=0;i<(n||6);i++){
      parts.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:-2-Math.random()*3,life:40+Math.random()*20,emoji:emoji,s:0.7+Math.random()*0.8});
    }
  }
  function feed(kind,pts){
    var p=pets[kind];
    p.v=Math.min(100,p.v+12); p.feed=Date.now();
    state.combo++; state.score+=pts*(1+Math.floor(state.combo/5));
    SFX.coin(); burst(p.x+50,p.y,'❤');
    if(state.combo%10===0){SFX.combo(state.combo); toast(t('comboToast')(state.combo));}
    if(pets.cat.v>=100&&pets.dog.v>=100){
      state.level++; pets.cat.v=60; pets.dog.v=60;
      state.score+=50; SFX.levelUp();
      toast(t('lvup')(state.level));
      burst(W/2,H/2,'⭐',12);
    }
  }
  function gameOver(reason){
    state.over=true; state.running=false; state.overMsg=reason;
    AOXSound.stopBGM(); SFX.lose();
    if(state.score>best){best=state.score; localStorage.setItem('petgameBest',best); state.newBest=true;}
    updateHud();
  }
  function update(){
    if(!state.running)return;
    var tm=(Date.now()-t0)/1000;
    var sp=6;
    if(keys.left)hero.x-=sp;
    if(keys.right)hero.x+=sp;
    if(mouse.active)hero.x+=(mouse.x-hero.x)*0.3;
    hero.x=Math.max(30,Math.min(W-30,hero.x));
    pets.cat.v-=0.012*state.level; pets.dog.v-=0.012*state.level;
    if(pets.cat.v<=0){gameOver(t('catHungry'));return;}
    if(pets.dog.v<=0){gameOver(t('dogHungry'));return;}
    spawnTick--;
    if(spawnTick<=0){
      spawn();
      spawnTick=Math.max(26,60-state.level*4-state.score/80);
    }
    var hw=24*hero.s,hh=34*hero.s;
    for(var i=items.length-1;i>=0;i--){
      var it=items[i];
      it.y+=it.vy; it.rot+=it.vr;
      var hit=hero.x-hw/2<it.x+14&&hero.x+hw/2>it.x-14&&it.y+14>hero.y+8&&it.y-14<hero.y+hh;
      if(hit){
        items.splice(i,1);
        if(it.type.t==='bomb'){
          state.lives--; state.combo=0; SFX.hit(); burst(it.x,it.y,'💥',8);
          if(state.lives<=0){gameOver(t('bomb'));return;}
        } else if(it.type.t==='heart'){
          state.lives=Math.min(5,state.lives+1); state.score+=5; SFX.gem(); burst(it.x,it.y,'💖',6);
        } else {
          feed(it.type.feed,it.type.pts);
        }
        updateHud(); continue;
      }
      if(it.y>H-60){
        items.splice(i,1);
        if(it.type.t!=='bomb'&&it.type.t!=='heart'){
          var p=pets[it.type.feed];
          p.v=Math.max(1,p.v-6); state.combo=0; SFX.hurt();
          burst(it.x,H-58,'💢',3); updateHud();
        }
      }
    }
    for(var j=parts.length-1;j>=0;j--){
      var q=parts[j];
      q.x+=q.vx; q.y+=q.vy; q.vy+=0.12; q.life--;
      if(q.life<=0)parts.splice(j,1);
    }
  }
  // 开始页装饰：飘落的美食图标（无小人无猫狗）
  var menuIcons=[];for(var mi=0;mi<8;mi++)menuIcons.push({x:Math.random()*W,y:Math.random()*H,v:0.4+Math.random()*0.6,icon:TYPES[Math.floor(Math.random()*TYPES.length)].icon,ph:Math.random()*6});
  function draw(){
    var tm=(Date.now()-t0)/1000;
    ctx.fillStyle='#5fb53f'; ctx.fillRect(0,H-46,W,46);
    ctx.fillStyle='#3d8b2a'; ctx.fillRect(0,H-46,W,6);
    for(var g=0;g<W;g+=18){ctx.fillStyle='#4a9e33';ctx.fillRect(g+4,H-32,3,5);}
    if(!started){
      // 标题页：只有风景和飘落美食
      for(var i=0;i<menuIcons.length;i++){
        var m=menuIcons[i];
        m.y+=m.v; if(m.y>H-40){m.y=-20;m.x=Math.random()*W;}
        ctx.globalAlpha=0.5; ctx.font='24px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(m.icon,m.x+Math.sin(tm+m.ph)*14,m.y); ctx.globalAlpha=1;
      }
      ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,H/2-108,W,180);
      ctx.fillStyle='#ffd700'; ctx.font='bold 30px "Press Start 2P",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐾',W/2,H/2-78);
      ctx.font='bold 22px monospace'; ctx.fillStyle='#fff';
      ctx.fillText(t('menu1'),W/2,H/2-30);
      ctx.font='16px monospace';
      ctx.fillText(t('menu2'),W/2,H/2+4);
      ctx.fillStyle='#4dd0e1'; ctx.font='13px monospace';
      ctx.fillText(t('tapLang'),W/2,H/2+46);
      return;
    }
    // 游戏中：猫狗 + 名牌
    drawCat(pets.cat.x,pets.cat.y,pets.cat.s,tm,pets.cat.v);
    drawDog(pets.dog.x,pets.dog.y,pets.dog.s,tm,pets.dog.v);
    bar(20,H-200,110,pets.cat.v,t('catName')+' · '+t('catKind'),'🐱');
    bar(W-130,H-200,110,pets.dog.v,t('dogName')+' · '+t('dogKind'),'🐶');
    if(Date.now()-pets.cat.feed<700&&Math.floor(tm*6)%2===0){ctx.font='20px serif';ctx.fillText('💗',pets.cat.x+30,pets.cat.y-6);}
    if(Date.now()-pets.dog.feed<700&&Math.floor(tm*6)%2===0){ctx.font='20px serif';ctx.fillText('💗',pets.dog.x+30,pets.dog.y-6);}
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i2=0;i2<items.length;i2++){
      var it=items[i2];
      ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(Math.sin(it.rot)*0.4);
      ctx.font='26px serif'; ctx.fillText(it.type.icon,0,0);
      ctx.restore();
    }
    ctx.fillStyle='#8d5524'; ctx.fillRect(hero.x-34,hero.y+66,68,8);
    ctx.fillStyle='#000'; ctx.globalAlpha=0.25; ctx.fillRect(hero.x-30,hero.y+66,60,3); ctx.globalAlpha=1;
    drawHero(hero.x-24*hero.s/2,hero.y,hero.s,tm);
    for(var j=0;j<parts.length;j++){
      var q=parts[j];
      ctx.globalAlpha=Math.min(1,q.life/30);
      ctx.font=Math.floor(18*q.s)+'px serif'; ctx.fillText(q.emoji,q.x,q.y);
      ctx.globalAlpha=1;
    }
    if(!state.running&&state.over){
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,H/2-90,W,150);
      ctx.fillStyle='#e53935'; ctx.font='bold 28px "Press Start 2P",monospace';
      ctx.fillText(t('over'),W/2,H/2-44);
      ctx.fillStyle='#fff'; ctx.font='16px monospace';
      ctx.fillText(state.overMsg||'',W/2,H/2-6);
      ctx.fillText(t('scoreTxt')+' '+state.score+' · '+t('best')+' '+best+(state.newBest?'  ⭐'+t('newBest'):''),W/2,H/2+26);
    }
  }
  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  // ===== 输入（键盘 + 鼠标 + 触屏 + 手机按键）=====
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
  });
  document.addEventListener('keyup',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
  });
  function toGame(e){
    var r=canvas.getBoundingClientRect();
    var cx=(e.touches?e.touches[0].clientX:e.clientX);
    return (cx-r.left)*(W/r.width);
  }
  canvas.addEventListener('mousemove',function(e){
    mouse.x=toGame(e); mouse.active=true;
  });
  canvas.addEventListener('touchstart',function(e){
    e.preventDefault(); mouse.x=toGame(e); mouse.active=true;
  },{passive:false});
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault(); mouse.x=toGame(e); mouse.active=true;
  },{passive:false});
  // 手机 ◀▶ 长按键
  function bindHold(id,dir){
    var b=document.getElementById(id);
    var on=function(e){e.preventDefault();keys[dir]=true;mouse.active=false;};
    var off=function(e){e.preventDefault();keys[dir]=false;};
    b.addEventListener('pointerdown',on);
    b.addEventListener('pointerup',off);
    b.addEventListener('pointerleave',off);
    b.addEventListener('pointercancel',off);
  }
  bindHold('mbL','left'); bindHold('mbR','right');

  document.getElementById('startBtn').addEventListener('click',function(){
    init(); started=true; state.running=true;
    SFX.click(); AOXSound.startBGM('menu');
  });
  applyLang(); init(); loop();
})();
</script>
</body>
</html>
