<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>？？？ · AoXuan</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:linear-gradient(160deg,#0a0620 0%,#1a1040 55%,#241457 100%); }
  #gameCanvas { background:linear-gradient(#101038,#1d1250); border:3px solid #5c6bc0; box-shadow:0 0 50px #7c4dff44; border-radius:10px; touch-action:manipulation; }
  .cmd { cursor:pointer; user-select:none; }
  .key { display:inline-block; background:#2a2158; border:2px solid #000; box-shadow: inset -2px -2px 0 0 #140f33, inset 2px 2px 0 0 #4f4396; padding:3px 8px; font-family:'Press Start 2P',monospace; font-size:10px; margin:0 2px; color:#fff; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="logo">⛏ AoXuan.World</a>
  <nav><a href="index.html">首页</a></nav>
</div>
<div class="container center">
  <h1 class="title-3d" style="font-size:30px;">🌟 星穹开拓·Q萌版</h1>
  <p class="subtitle">开——拓——！指挥Q萌小队，驶向银河尽头！(二创致敬之作)</p>
  <div class="hud" style="margin-top:16px;">
    <div class="hud-item"><span class="label">关卡</span><span id="stage">1/5</span></div>
    <div class="hud-item"><span class="label">波次</span><span id="round">1</span></div>
    <div class="hud-item"><span class="label">💎星琼</span><span id="gems">0</span></div>
    <div class="hud-item"><span class="label">状态</span><span id="stat">备战</span></div>
  </div>
  <div class="game-stage" style="margin-top:12px;"><canvas id="gameCanvas" width="560" height="420"></canvas></div>
  <div id="cmdBar" style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn gold" id="btnAtk">⚔ 攻击</button>
    <button class="mc-btn" id="btnSkill">✨ 战技</button>
    <button class="mc-btn" id="btnUlt">💫 终结技</button>
    <button class="mc-btn" id="btnDef">🛡 防御</button>
  </div>
  <div id="log" style="margin-top:10px;background:#00000088;border:2px solid #5c6bc0;border-radius:8px;padding:10px 14px;max-width:560px;min-height:90px;max-height:150px;overflow-y:auto;color:#c5cae9;font-size:13px;line-height:1.7;text-align:left;"></div>
  <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="mc-btn green" id="newBtn">🔄 重新开始开拓</button>
    <a href="index.html" class="mc-btn">← 返回大厅</a>
  </div>
</div>
<div class="ground" style="position:fixed;bottom:0;left:0;right:0;z-index:0;"></div>
<script src="sound.js"></script>
<script src="mobile.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  // ===== Q萌角色 =====
  var CHARS=[
   {id:'mc',n:'开拓者',i:'⚔️',hp:120,mhp:120,atk:16,def:8,spd:10,clr:'#ffb300',
    sk:{n:'大坂口袋糖·嘲讽',d:'嘲讽全体敌人并给自己套盾18点(2回合)'},ult:{n:'星穹斩',d:'对全体敌人造成2.2倍伤害'}},
   {id:'mar',n:'三月七',i:'❄️',hp:100,mhp:100,atk:14,def:6,spd:12,clr:'#4dd0e1',
    sk:{n:'冰箭·冻住你',d:'单体1.6倍伤害并冰冻1回合'},ult:{n:'永冬喜剧',d:'全体1.4倍伤害+50%冰冻'}},
   {id:'dan',n:'丹恒',i:'🐉',hp:96,mhp:96,atk:21,def:5,spd:14,clr:'#66bb6a',
    sk:{n:'穿云一枪',d:'单体2.4倍高伤(血<30%目标+50%)'},ult:{n:'天龙贯',d:'单体3.4倍毁灭一击'}},
   {id:'himeko',n:'姬子',i:'☕',hp:104,mhp:104,atk:18,def:6,spd:11,clr:'#ef5350',
    sk:{n:'灼热之吻',d:'单体1.4倍+灼烧3回合(每回合8)'},ult:{n:'天逆流星',d:'全体1.9倍+点燃'}}
  ];
  var STAGES=[
   [{n:'太空扑满',i:'🐷',hp:70,atk:10,clr:'#ff8fb1'},{n:'扑满仔',i:'🐽',hp:40,atk:7,clr:'#f48fb1'}],
   [{n:'自动机兵',i:'🤖',hp:80,atk:13,clr:'#90a4ae'},{n:'自动机兵',i:'🤖',hp:80,atk:13,clr:'#90a4ae'},{n:'侦察无人机',i:'🛸',hp:45,atk:9,clr:'#a0e9ff'}],
   [{n:'冰原狼',i:'🐺',hp:95,atk:15,clr:'#b3e5fc'},{n:'冰原狼',i:'🐺',hp:95,atk:15,clr:'#b3e5fc'}],
   [{n:'史瓦罗',i:'🦾',hp:190,atk:19,clr:'#ffab91'},{n:'无人机群',i:'🛸',hp:40,atk:8,clr:'#a0e9ff'}],
   [{n:'末日兽·Q版',i:'🐲',hp:300,atk:24,clr:'#ce93d8',boss:1}]
  ];
  var team,foes,stage,round,turn,gems,phase,sel,log,floats,frame,over;
  function logAdd(t){
   var el=document.getElementById('log');
   el.innerHTML+='<div>'+t+'</div>';el.scrollTop=el.scrollHeight;
  }
  function init(){
   team=CHARS.slice(0,3).map(c=>Object.assign({},c,{energy:0,skCd:0,shield:0,taunt:0,alive:true}));
   stage=1;round=1;turn=0;gems=0;phase='cmd';sel=0;over=false;
   document.getElementById('log').innerHTML='';
   floats=[];frame=0;
   spawnFoes();
   logAdd('🌟 开拓小队登上星轨列车！第1站：空间站废墟。');
   logAdd('💡 点击指令行动 · 战技/终结技看准时机放！');
   updHud();
  }
  function spawnFoes(){
   foes=STAGES[stage-1].map((f,i)=>Object.assign({},f,{mhp:f.hp,alive:true,burn:0,frozen:0,x:0,idx:i}));
  }
  function aliveT(){return team.filter(c=>c.alive);}
  function aliveF(){return foes.filter(f=>f.alive);}
  function updHud(){
   document.getElementById('stage').textContent=stage+'/5';
   document.getElementById('round').textContent=round;
   document.getElementById('gems').textContent=gems;
   document.getElementById('stat').textContent=over?(gems>=50?'🏆 通关!':'💀 团灭...'):(phase==='cmd'?'你的回合':'敌方回合');
   document.getElementById('btnSkill').textContent='✨ 战技'+(cur().skCd>0?'(CD'+cur().skCd+')':'');
   document.getElementById('btnUlt').textContent='💫 终结技'+(cur().energy>=100?'(ready!)':'('+cur().energy+'%)');
  }
  function cur(){return aliveT()[Math.min(sel,aliveT().length-1)]||team[0];}
  function floatTxt(x,y,t,c){floats.push({x:x,y:y,t:t,c:c||'#fff',life:44});}
  // ===== 玩家指令 =====
  function dmgFoe(f,base,tag){
   var v=Math.max(1,Math.round(base*(0.9+Math.random()*0.2)));
   f.hp-=v;
   floats.push({x:f.x,y:120,t:'-'+v,c:'#ffd700',life:44});
   logAdd((tag||'')+'对 '+f.n+' 造成 <b style="color:#ffd700">'+v+'</b> 伤害!');
   SFX.hit();
   if(f.hp<=0){f.alive=false;f.hp=0;gems+=f.boss?20:4;SFX.boom();logAdd('💥 '+f.n+' 被击倒! +'+(f.boss?20:4)+'星琼');}
  }
  function act(type){
   if(phase!=='cmd'||over)return;
   var c=cur();
   if(type==='atk'){
    var t=aliveF()[0];if(!t)return;
    dmgFoe(t,c.atk,'⚔ '+c.n);
    c.energy=Math.min(100,c.energy+20);
   }else if(type==='sk'){
    if(c.skCd>0){logAdd('⏳ '+c.n+' 的战技还在冷却!');return;}
    c.skCd=3;c.energy=Math.min(100,c.energy+30);
    if(c.id==='mc'){c.shield=18;c.taunt=2;logAdd('🛡 开拓者嘲讽全体+护盾18!');SFX.place();}
    else if(c.id==='mar'){var t1=aliveF()[0];if(t1){dmgFoe(t1,c.atk*1.6,'❄️ 三月七');t1.frozen=1;logAdd('🧊 '+t1.n+' 被冻住了!');}}
    else if(c.id==='dan'){var t2=aliveF()[0];if(t2){var mult=t2.hp<t2.mhp*.3?2.4*1.5:2.4;dmgFoe(t2,c.atk*mult,'🐉 丹恒');}}
    else if(c.id==='himeko'){var t3=aliveF()[0];if(t3){dmgFoe(t3,c.atk*1.4,'🔥 姬子');t3.burn=3;}}
   }else if(type==='ult'){
    if(c.energy<100){logAdd('💫 能量不足('+c.energy+'%)');return;}
    c.energy=0;SFX.levelUp();
    logAdd('💫 <b style="color:#e040fb">'+c.n+' 释放【'+c.ult.n+'】!</b>');
    if(c.id==='mc')aliveF().forEach(f=>dmgFoe(f,c.atk*2.2,'⚔'));
    else if(c.id==='mar')aliveF().forEach(f=>{dmgFoe(f,c.atk*1.4,'❄️');if(Math.random()<.5&&f.alive)f.frozen=1;});
    else if(c.id==='dan'){var t4=aliveF()[0];if(t4)dmgFoe(t4,c.atk*3.4,'🐉');}
    else if(c.id==='himeko')aliveF().forEach(f=>{dmgFoe(f,c.atk*1.9,'🔥');if(f.alive)f.burn=3;});
   }else if(type==='def'){
    c.shield+=10;c.energy=Math.min(100,c.energy+35);
    logAdd('🛡 '+c.n+' 稳住阵脚(护盾+10,回能)。');
   }
   team.forEach(c2=>{if(c2.skCd>0)c2.skCd--;});
   updHud();
   if(!aliveF().length){nextStage();return;}
   phase='foe';
   setTimeout(foeTurn,700);
  }
  function foeTurn(){
   if(over)return;
   aliveF().forEach(f=>{
    if(!f.alive)return;
    if(f.frozen>0){f.frozen--;logAdd('🧊 '+f.n+' 被冻结,无法行动!');return;}
    if(f.burn>0){f.burn--;f.hp-=8;floats.push({x:f.x,y:120,t:'-8🔥',c:'#ff8a65',life:40});
     if(f.hp<=0){f.alive=false;gems+=4;logAdd('🔥 '+f.n+' 被烧倒了!');return;}}
    // 选目标: 嘲讽优先
    var tg=team.filter(c=>c.alive&&c.taunt>0)[0]||aliveT()[Math.floor(Math.random()*aliveT().length)];
    if(!tg)return;
    var v=Math.max(1,Math.round(f.atk*(0.85+Math.random()*0.3))-tg.def);
    if(tg.shield>0){var abs=Math.min(tg.shield,v);tg.shield-=abs;v-=abs;logAdd('🛡 '+tg.n+' 的护盾吸收'+abs+'伤害');}
    if(v>0){tg.hp-=v;floats.push({x:0,y:0,t:'-'+v,c:'#ff5252',life:40,target:tg});
     logAdd('💢 '+f.n+' 攻击 '+tg.n+' 造成 '+v+' 伤害!');SFX.hurt();}
    if(tg.hp<=0){tg.alive=false;tg.hp=0;logAdd('😭 '+tg.n+' 倒下了...');}
   });
   team.forEach(c=>{if(c.taunt>0)c.taunt--;});
   round++;updHud();
   if(!aliveT().length){endGame(false);return;}
   phase='cmd';sel=0;updHud();
  }
  function nextStage(){
   if(stage>=STAGES.length){endGame(true);return;}
   stage++;round=1;
   gems+=10;
   // 恢复
   team.forEach(c=>{c.hp=Math.min(c.mhp,c.hp+Math.round(c.mhp*.4));c.alive=c.hp>0;if(!c.alive)c.hp=1,c.alive=true;});
   spawnFoes();
   logAdd('🚄 列车抵达第'+stage+'站! 小队恢复40%生命, +10星琼');
   SFX.unlock();updHud();
   phase='cmd';
  }
  function endGame(win){
   over=true;phase='over';
   if(win){Site.winGame(gems+'星琼');localStorage.setItem('hsr_clear',Date.now());logAdd('🏆 <b style="color:#ffd700">银河尽头到了！开拓完成！总星琼'+gems+'</b>');SFX.win();}
   else{Site.loseGame();logAdd('💀 列车被迫返航... 再接再厉,开拓者!');SFX.lose();}
   updHud();
  }
  // ===== 绘制 =====
  function drawChar(c,x,y,w,h){
   ctx.save();
   ctx.globalAlpha=c.alive?1:.3;
   // Q萌圆角身体
   ctx.shadowColor=c.clr;ctx.shadowBlur=c.alive?14:0;
   ctx.fillStyle=c.clr;
   roundRect(x,y,w,h,14);ctx.fill();
   ctx.shadowBlur=0;
   ctx.strokeStyle='#000a';ctx.lineWidth=2;roundRect(x,y,w,h,14);ctx.stroke();
   // 表情脸
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+w*.32,y+h*.38,7,0,7);ctx.arc(x+w*.68,y+h*.38,7,0,7);ctx.fill();
   ctx.fillStyle='#000';
   var ex=c.alive?0:2;
   ctx.beginPath();ctx.arc(x+w*.32,y+h*.39+(c.alive?0:1),3,0,7);ctx.arc(x+w*.68,y+h*.39+(c.alive?0:1),3,0,7);ctx.fill();
   ctx.strokeStyle='#000';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(x+w/2,y+h*.55,5,c.alive?0.2:Math.PI, c.alive?Math.PI-0.2:Math.PI*2);ctx.stroke();
   // 头像emoji
   ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText(c.i,x+w/2,y+h*.78);
   ctx.restore();
  }
  function roundRect(x,y,w,h,r){
   ctx.beginPath();
   ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function draw(){
   frame++;
   ctx.clearRect(0,0,W,H);
   // 星空
   ctx.fillStyle='#0d0b2e';ctx.fillRect(0,0,W,H);
   for(var s=0;s<50;s++){
    var sx=(s*127+frame*.2*(1+s%3))%W,sy=(s*211)%H;
    ctx.fillStyle='rgba(255,255,255,'+(.12+(s%4)*.12)+')';
    ctx.fillRect(sx,sy,1.6,1.6);
   }
   // 敌人区(上)
   var fs2=aliveF().length?aliveF():foes.filter(f=>f.hp>0||!f.alive).slice(0,3);
   var fw=90,gap=(W-fw*Math.max(1,foes.length))/(foes.length+1);
   foes.forEach(function(f,i){
    var x=gap+i*(fw+gap),y=30;
    f.x=x+fw/2;
    ctx.save();ctx.globalAlpha=f.alive?1:.25;
    ctx.shadowColor=f.clr;ctx.shadowBlur=f.boss?22:10;
    ctx.fillStyle=f.clr;roundRect(x,y,fw,f.boss?86:70,16);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#000a';ctx.lineWidth=2;roundRect(x,y,fw,f.boss?86:70,16);ctx.stroke();
    ctx.font=(f.boss?34:26)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.i,x+fw/2,y+(f.boss?40:32));
    ctx.font='11px monospace';ctx.fillStyle='#fff';
    ctx.fillText(f.n,x+fw/2,y+(f.boss?70:58));
    // 冰冻/灼烧标记
    if(f.frozen>0){ctx.font='16px serif';ctx.fillText('🧊',x+fw-14,y+14);}
    if(f.burn>0){ctx.font='16px serif';ctx.fillText('🔥',x+12,y+14);}
    ctx.restore();
    // 血条
    ctx.fillStyle='#000';ctx.fillRect(x,y-8,fw,6);
    ctx.fillStyle=f.hp/f.mhp>.5?'#66bb6a':f.hp/f.mhp>.25?'#ffb300':'#ef5350';
    ctx.fillRect(x+1,y-7,(fw-2)*Math.max(0,f.hp/f.mhp),4);
   });
   // 分隔线(星轨)
   ctx.strokeStyle='#5c6bc066';ctx.setLineDash([6,10]);ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(0,148);ctx.lineTo(W,148);ctx.stroke();ctx.setLineDash([]);
   // 我方区(下)
   var tw=120,tgap=(W-tw*3)/4;
   team.forEach(function(c,i){
    var x=tgap+i*(tw+tgap),y=200;
    drawChar(c,x,y,tw,86);
    // 血条+能量
    ctx.fillStyle='#000';ctx.fillRect(x,y+92,tw,8);
    ctx.fillStyle='#43a047';ctx.fillRect(x+1,y+93,(tw-2)*Math.max(0,c.hp/c.mhp),6);
    ctx.fillStyle='#000';ctx.fillRect(x,y+102,tw,6);
    ctx.fillStyle=c.energy>=100?'#e040fb':'#7986cb';
    ctx.fillRect(x+1,y+103,(tw-2)*c.energy/100,4);
    if(c.shield>0){ctx.font='14px serif';ctx.textAlign='left';ctx.fillText('🛡'+c.shield,x+2,y+14);}
    // 选中框
    if(i===sel&&phase==='cmd'&&!over){
     var pul=3+Math.sin(frame*.15)*2;
     ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
     roundRect(x-pul,y-pul,tw+pul*2,86+pul*2,16);ctx.stroke();
    }
    ctx.font='bold 12px monospace';ctx.fillStyle=c.alive?'#fff':'#777';ctx.textAlign='center';
    ctx.fillText(c.n,x+tw/2,y-8);
   });
   // 飘字
   floats=floats.filter(f=>f.life>0);
   floats.forEach(function(f){
    f.life--;f.y-=0.7;
    ctx.globalAlpha=Math.min(1,f.life/20);
    ctx.font='bold 16px monospace';ctx.textAlign='center';
    var fx=f.x,fy=f.y;
    if(f.target){var idx=team.indexOf(f.target);fx=tgap+idx*(tw+tgap)+tw/2;fy=200+40;}
    ctx.fillStyle='#000';ctx.fillText(f.t,fx+1,fy+1);
    ctx.fillStyle=f.c;ctx.fillText(f.t,fx,fy);
    ctx.globalAlpha=1;
   });
   if(over){
    ctx.fillStyle='rgba(10,6,32,.75)';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.shadowColor='#e040fb';ctx.shadowBlur=24;
    ctx.fillStyle='#fff';ctx.font='bold 26px monospace';ctx.textAlign='center';
    ctx.fillText(gems>=50?'🏆 开拓完成!':'💥 任务失败',W/2,H/2-8);ctx.restore();
    ctx.fillStyle='#c5cae9';ctx.font='14px monospace';
    ctx.fillText('星琼 '+gems+' · 点「重新开始开拓」',W/2,H/2+22);
   }
   requestAnimationFrame(draw);
  }
  // 选择角色
  canvas.addEventListener('click',function(ev){
   if(phase!=='cmd'||over)return;
   var r=canvas.getBoundingClientRect();
   var mx=(ev.clientX-r.left)*(W/r.width);
   var tw=120,tgap=(W-tw*3)/4;
   for(var i=0;i<3;i++){
    var x=tgap+i*(tw+tgap);
    if(mx>=x&&mx<=x+tw){if(team[i].alive){sel=i;SFX.select();}break;}
   }
  });
  document.getElementById('btnAtk').onclick=()=>act('atk');
  document.getElementById('btnSkill').onclick=()=>act('sk');
  document.getElementById('btnUlt').onclick=()=>act('ult');
  document.getElementById('btnDef').onclick=()=>act('def');
  document.getElementById('newBtn').onclick=function(){SFX.click();Site.beginGame('🌟 星穹开拓·Q萌版',{},function(){init();});};
  function toast(t){var e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e);}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2200);}
  // ===== 满级解锁校验 =====
  if(window.Site){
   var p=Site.pet();
   if(!p||p.level<(Site.PET_MAX||10)){
    document.body.innerHTML='<div class="container center" style="padding-top:120px">'+
     '<div style="font-size:80px">🌌</div>'+
     '<h1 style="color:#c5cae9;font-size:22px;">...</h1>'+
     '<p style="color:#5c6bc0;font-size:14px;">这片星域还很安静。</p>'+
     '<a href="index.html" class="mc-btn" style="margin-top:20px">← 返回</a></div>';
    return;
   }
   Site.beginGame('🌟 星穹开拓·Q萌版',{},init);
  }else{init();}
  draw();
})();
</script>
</body>
</html>
